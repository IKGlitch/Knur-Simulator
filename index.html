/* ==========================================================================
   08_exercises — library, exercise detail + progress chart, create/edit
   sheet, and the multi-select exercise picker used by workouts & templates.
   ========================================================================== */
const EX_FILTERS = ['All', 'Recent', 'Mine', ...MUSCLES];

function filterExercises(list, query, filter) {
  let l = list;
  if (filter === 'Recent') l = l.filter((e) => e.lastUsed).sort((a, b) => b.lastUsed - a.lastUsed);
  else if (filter === 'Mine') l = l.filter((e) => e.custom);
  else if (filter && filter !== 'All') l = l.filter((e) => e.muscle === filter);
  const q = (query || '').trim().toLowerCase();
  if (q) {
    const words = q.split(/\s+/);
    l = l.filter((e) => words.every((w) => `${e.name} ${e.muscle} ${e.equipment}`.toLowerCase().includes(w)));
  }
  return l;
}
function exRowHtml(e, { selected = null, action = 'openExercise' } = {}) {
  const sel = selected ? selected.indexOf(e.id) : -1;
  const meta = [e.custom ? 'Yours' : '', e.muscle, e.equipment].filter(Boolean).join(' · ') + (e.timesUsed ? ` · ${e.timesUsed}×` : '');
  return `<button class="list-item" style="width:100%;text-align:left" data-a="${action}" data-id="${e.id}">${exAvatar(e)}
    <div class="grow"><div class="ell">${esc(e.name)}</div><div class="small dim ell">${esc(meta)}</div>${lastLine(e)}</div>
    ${selected ? `<div class="check ${sel >= 0 ? 'on' : ''}">${sel >= 0 ? sel + 1 : ''}</div>` : icon('chev', 'faint')}</button>`;
}
/** "Last Mon 14 Sep · 80×8 · 80×8" for rows in the library and picker. */
function lastLine(e) {
  if (!e.lastUsed || !e.lastSets || !e.lastSets.length) return '';
  const u = unit();
  const work = e.lastSets.filter((x) => x.kind !== 'warmup');
  const parts = (work.length ? work : e.lastSets).slice(0, 4).map((x) => summarizeSet(e.tracking, x, u)).filter((t) => t && t !== '—');
  if (!parts.length) return '';
  const more = (work.length ? work : e.lastSets).length > 4 ? ' …' : '';
  return `<div class="tiny faint ell tnum">Last ${esc(fmtDay(e.lastUsed))} · ${esc(parts.join(' · '))}${more}</div>`;
}
function exListHtml(list, query, opts) {
  const q = (query || '').trim();
  const exact = S.exercises.some((e) => !e.hidden && e.name.toLowerCase() === q.toLowerCase());

  if (q.length > 1 && !exact) {

      <div class="avatar" style="color:var(--accent)">${icon('plus')}</div><div class="grow accent" style="color:var(--accent)">Create “${esc(q)}”</div></button>`;
  }
  html += list.map((e) => exRowHtml(e, opts)).join('');
  if (!list.length && !(q.length > 1 && !exact)) html += `<p class="dim" style="text-align:center;margin-top:24px">No exercises match.</p>`;
  return html;
}

}

// ---------- create / edit sheet ----------
function exerciseSheet(id, name, onCreated) {
  const existing = id ? exById(S, id) : null;
  const form = existing
    ? { name: existing.name, muscle: existing.muscle, equipment: existing.equipment, tracking: existing.tracking }
    : { ...guessExercise(name || '') };
  const body = () => `<div class="caps">Name</div>
    <input class="field mt8" id="exf-name" value="${esc(form.name)}" placeholder="e.g. Landmine Press" autocomplete="off" enterkeyhint="done">
    <div class="caps mt24">Type</div><div class="stack mt8">${TRACKING_TYPES.map(
      (t) => `<button class="card" style="width:100%;text-align:left;padding:12px;${form.tracking === t.id ? 'border-color:var(--accent)' : ''}" data-xf="tracking" data-v="${t.id}">
        <div class="bold" style="${form.tracking === t.id ? 'color:var(--accent)' : ''}">${esc(t.label)}</div><div class="small dim">${esc(t.hint)}</div></button>`,
    ).join('')}</div>
    <div class="caps mt24">Muscle group</div><div class="chips wrap mt8">${MUSCLES.map((m) => `<button class="chip ${form.muscle === m ? 'on' : ''}" data-xf="muscle" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <div class="caps mt24">Equipment</div><div class="chips wrap mt8">${EQUIPMENT.map((m) => `<button class="chip ${form.equipment === m ? 'on' : ''}" data-xf="equipment" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <button class="btn primary mt24" data-xf="save">${existing ? 'Save' : 'Create exercise'}</button>
    ${existing ? `<button class="btn danger mt12" data-xf="hide">${existing.custom ? 'Delete exercise' : 'Hide from library'}</button>` : ''}`;
  const el = openSheet({ title: existing ? 'Edit exercise' : 'New exercise', body: body(), full: true });
  const bodyEl = $('.sheet-body', el);
  bodyEl.addEventListener('input', (ev) => { if (ev.target.id === 'exf-name') form.name = ev.target.value; });
  bodyEl.addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-xf]');
    if (!b) return;
    const k = b.dataset.xf;
    if (k === 'save') {
      if (!form.name.trim()) { alertDlg('Name required', 'Give the exercise a name.'); return; }
      if (existing) {
        Object.assign(existing, { name: form.name.trim(), muscle: form.tracking === 'cardio' ? 'Cardio' : form.muscle, equipment: form.equipment, tracking: form.tracking, category: form.tracking === 'cardio' ? 'cardio' : 'strength' });
      } else {
        const newId = createExercise(S, { ...form, muscle: form.tracking === 'cardio' ? 'Cardio' : form.muscle });
        ui.lastCreatedExercise = newId;
        Layer.close();
        commit();
        if (onCreated) onCreated(newId);
        else toast(`Added “${form.name.trim()}” to your exercises`);
        return;
      }
      Layer.close();
      commit();
      return;
    }
    if (k === 'hide') {
      const ok = await confirmDlg(existing.custom ? 'Delete exercise?' : 'Hide exercise?', 'It disappears from the library. Past workouts keep their history.', existing.custom ? 'Delete' : 'Hide', true);
      if (!ok) return;
      existing.hidden = true;
      Layer.close();
      commit({ render: false });
      go('exercises', { replace: true });
      return;
    }
    form[k] = b.dataset.v;
    if (k === 'tracking' && b.dataset.v === 'cardio') form.muscle = 'Cardio';
    const y = bodyEl.scrollTop;
    bodyEl.innerHTML = body();
    bodyEl.scrollTop = y;
  });
  if (!existing) setTimeout(() => $('#exf-name', el)?.focus(), 80);
}

// ---------- detail ----------
const detailMetric = {};
function metricsFor(tracking, u) {
  const w = (v) => String(Math.round(toDisplayWeight(v, u) * 10) / 10);
  switch (tracking) {
    case 'bodyweight_reps': return [{ k: 'reps', label: 'Most reps', v: (st) => st.maxReps, f: (v) => String(Math.round(v * 100) / 100) }];
    case 'time': return [{ k: 'hold', label: 'Longest hold', v: (st, sets) => Math.max(0, ...sets.map((s) => s.durationS || 0)) || null, f: fmtClock }];
    case 'cardio': return [
      { k: 'dist', label: 'Distance', v: (st) => st.distanceM || null, f: (v) => `${fmtKm(v)} km` },
      { k: 'time', label: 'Duration', v: (st) => st.durationS || null, f: fmtClock },
      { k: 'pace', label: 'Pace /km', invert: true, v: (st, sets) => bestPace(sets), f: fmtClock },
    ];
    default: return [
      { k: 'e1rm', label: 'Est. 1RM', v: (st) => st.bestE1rm, f: w, unit: true },
      { k: 'weight', label: 'Heaviest', v: (st) => st.maxWeight, f: w, unit: true },
      { k: 'volume', label: 'Volume', v: (st) => st.volumeKg || null, f: (v) => fmtInt(toDisplayWeight(v, u)), unit: true },
    ];
  }
}
function lineChart(points, { color = 'var(--accent)', format = String, invert = false, height = 150 } = {}) {
  if (points.length < 2) return `<p class="small dim" style="padding:16px 0">Log this exercise twice to see a trend.</p>`;
  const W = 340, H = height, pl = 6, pr = 48, pt = 12, pb = 12;
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if (minY === maxY) { minY -= 1; maxY += 1; }
  const w = W - pl - pr, h = H - pt - pb;
  const sx = (x) => pl + (maxX === minX ? w / 2 : ((x - minX) / (maxX - minX)) * w);
  const sy = (y) => { const t = (y - minY) / (maxY - minY); return pt + (invert ? t : 1 - t) * h; };
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
  const top = invert ? minY : maxY, bottom = invert ? maxY : minY;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
    <line x1="${pl}" x2="${pl + w}" y1="${pt}" y2="${pt}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <line x1="${pl}" x2="${pl + w}" y1="${pt + h}" y2="${pt + h}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text x="${W - 2}" y="${pt + 4}" fill="var(--faint)" font-size="11" text-anchor="end">${esc(format(top))}</text>
    <text x="${W - 2}" y="${pt + h + 4}" fill="var(--faint)" font-size="11" text-anchor="end">${esc(format(bottom))}</text>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${i === points.length - 1 ? 4 : 2}" fill="${color}"/>`).join('')}</svg>`;
}

VIEWS.exercise = (r) => {
  const ex = exById(S, r.id);
  if (!ex) return { redirect: 'exercises' };
  const u = unit();
  const hist = exerciseHistory(S, ex.id);
  const metrics = metricsFor(ex.tracking, u);
  const m = metrics.find((x) => x.k === detailMetric[ex.id]) || metrics[0];

  html += `<div class="card mt8"><div class="caps">${esc(m.label)}${m.unit ? ` (${u})` : ''}</div>${lineChart(points, { color: ex.tracking === 'cardio' ? 'var(--cardio)' : 'var(--accent)', format: m.f, invert: m.invert })}</div>`;

    })

  return {

    titleHtml: '&nbsp;',
    left: backBtn('exercises'),
    right: `<button class="icon-btn" data-a="editExercise" data-id="${ex.id}" aria-label="Edit exercise" style="color:var(--accent)">${icon('edit')}</button>`,

A.exportBackup = async () => {
  if (blockedReadOnly()) return; // would export an empty file
  const name = backupFileName();
  const json = JSON.stringify(makeBackup(S));
  const blob = new Blob([json], { type: 'application/json' });
  let shared = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      shared = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user closed the share sheet
  }
  if (!shared) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  S.settings.lastBackupAt = Date.now();
  commit();
  toast(shared ? 'Backup ready. Save it to Files or iCloud Drive.' : `Saved ${name}`);
};

C.importFile = async (d, el) => {

  } catch (e) {
    alertDlg('Can’t restore that file', e instanceof SyntaxError ? 'The file is not valid JSON.' : e.message);
    return;
  }
  const c = stateCounts(next);
  if (blockedReadOnly()) return;
  const ok = await confirmDlg('Replace all data?', `The backup has ${plural(c.workouts, 'workout')} and ${plural(c.templates, 'template')}. Everything currently in the app is replaced. A restore point is kept so you can undo.`, 'Replace', true);
  if (!ok) return;
  await Store.snapshot('before restore');
  replaceState(next);
  toast(`Restored ${plural(c.workouts, 'workout')}`);
};
function replaceState(next) {
  next.restTimer = null;
  S = next;
  Store.permitShrink(); // deliberate: restore / undo / erase may hold fewer workouts
  Store.flush();
  go('today', { replace: true });

/** Refuse data-replacing actions while storage can't be read (they'd overwrite it). */

    : `<p class="dim" style="text-align:center;margin:24px 0">No snapshots yet. The first one is made tomorrow, or before the next update.</p>`;
  const el = openSheet({ title: 'Snapshots', body: `<p class="small dim" style="margin-top:0">Copies Knur made automatically on this phone. Restoring one replaces your current data; the current data is kept as “Undo last restore”.</p><div class="card" style="padding:0 16px">${rows}</div>` });

/* ---- 10_tests.js ---- */
/* ==========================================================================
   10_tests — self-tests. Run KS.test() in the browser console, or
   `node source/run-tests.js` on the PC. DOM-free; uses a throwaway state.
   ========================================================================== */
KS.test = function test({ quiet = false } = {}) {
  let passed = 0;
  const failures = [];
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const ok = (name, cond) => (cond ? passed++ : failures.push(name));
  const is = (name, actual, expected) => (eq(actual, expected) ? passed++ : failures.push(`${name}: got ${JSON.stringify(actual)}, want ${JSON.stringify(expected)}`));
  const near = (name, a, b, eps = 0.01) => ok(`${name} (${a} ≈ ${b})`, a != null && Math.abs(a - b) < eps);
  const set = (weightKg, reps, extra = {}) => ({ weightKg, reps, durationS: null, distanceM: null, calories: null, ...extra });
  const DAY = 86400000;

  // --- parsing ---
  is('comma decimal', parseNumber('82,5'), 82.5);
  is('dot decimal', parseNumber('82.5'), 82.5);
  is('spaces', parseNumber(' 100 '), 100);
  is('trailing dot', parseNumber('10.'), 10);
  is('leading dot', parseNumber('.5'), 0.5);
  is('empty', parseNumber(''), null);
  is('junk', parseNumber('abc'), null);
  is('two dots', parseNumber('1.2.3'), null);
  is('count', parseCount('8'), 8);
  is('negative count', parseCount('-1'), null);
  is('mm:ss', parseDuration('1:30'), 90);
  is('h:mm:ss', parseDuration('1:02:03'), 3723);
  is('plain seconds', parseDuration('45'), 45);
  is('plain minutes', parseDuration('20', 'min'), 1200);
  is('comma minutes', parseDuration('20,5', 'min'), 1230);
  is('bad duration', parseDuration('1:x'), null);
  is('fraction', parseNumber('8 1/2'), 8.5);
  is('plain fraction', parseNumber('1/2'), 0.5);
  is('unicode half', parseNumber('8½'), 8.5);
  is('unicode half alone', parseNumber('½'), 0.5);
  is('zero denominator', parseNumber('1/0'), null);
  is('half rep, comma', parseReps('8,5'), 8.5);
  is('half rep, fraction', parseReps('7 1/2'), 7.5);
  is('third rep rounds', parseReps('1/3'), 0.33);
  is('negative reps', parseReps('-1'), null);
  is('reps field keeps halves', fieldsFor('weight_reps')[1].parse('8,5'), 8.5);
  is('reps field uses the decimal pad', fieldsFor('weight_reps')[1].mode, 'decimal');
  is('weight fraction', fieldsFor('weight_reps')[0].parse('22 1/2', 'kg'), 22.5);
  is('small plates', fieldsFor('weight_reps')[0].parse('81,25', 'kg'), 81.25);
  is('half rep summary', summarizeSet('weight_reps', { weightKg: 81.25, reps: 7.5 }, 'kg'), '81.25×7.5');
  is('half rep volume', setVolume({ weightKg: 80, reps: 8.5 }), 680);

  // --- units & formatting ---
  is('lb round trip', toDisplayWeight(fromDisplayWeight(225, 'lb'), 'lb'), 225);
  is('kg format', fmtWeight(82.5, 'kg'), '82.5');
  is('null weight', fmtWeight(null, 'kg'), '');
  is('clock', fmtClock(75), '1:15');
  is('clock hours', fmtClock(3723), '1:02:03');
  is('clock negative', fmtClock(-5), '0:00');
  is('pace', fmtPace(1200, 4000), '5:00 /km');
  is('pace no distance', fmtPace(100, 0), null);
  is('dur short', fmtDurShort(3900), '1h 5m');
  is('dur minutes', fmtDurShort(600), '10m');
  is('int', fmtInt(12450), '12 450');
  is('plural one', plural(1, 'set'), '1 set');
  is('plural many', plural(3, 'set'), '3 sets');
  is('plural y', plural(2, 'category'), '2 categories');
  is('plural vowel y', plural(2, 'day'), '2 days');
  is('esc', esc('<a href="x">'), '&lt;a href=&quot;x&quot;&gt;');
  const mon = new Date(startOfWeek(new Date(2026, 8, 23, 15).getTime()));
  is('week starts Monday', [mon.getDay(), mon.getDate(), mon.getHours()], [1, 21, 0]);
  const ids = new Set();
  for (let i = 0; i < 5000; i++) ids.add(newId());
  is('unique ids', ids.size, 5000);

  // --- stats ---
  is('e1rm single', estimate1RM(100, 1), 100);
  near('e1rm 10 reps', estimate1RM(100, 10), 133.33);
  is('e1rm capped', estimate1RM(100, 13), null);
  const st = sessionStats([set(40, 10, { kind: 'warmup' }), set(80, 8), set(80, 6)]);
  is('volume excludes warm-up', st.volumeKg, 80 * 14);
  is('sets include warm-up', st.sets, 3);
  const prevS = [[set(80, 8), set(80, 8)]];
  is('strength records', detectRecords('weight_reps', [set(82.5, 8), set(82.5, 8)], prevS).map((h) => h.type).sort(), ['e1rm', 'volume', 'weight']);
  is('no records first time', detectRecords('weight_reps', [set(80, 8)], []), []);
  is('no records when weaker', detectRecords('weight_reps', [set(70, 5)], prevS), []);
  is('pace record (lower wins)', detectRecords('cardio', [set(null, null, { durationS: 1440, distanceM: 5000 })], [[set(null, null, { durationS: 1500, distanceM: 5000 })]]).map((h) => h.type), ['pace']);

  // Empty set with no history can't be ticked.

  // --- model: templates ---

  ok('template deleted', !templateById(T, dup.id));

  // --- backup ---
  T.settings.unit = 'lb';
  const b = JSON.parse(JSON.stringify(makeBackup(T)));
  const R = stateFromBackup(b);
  is('backup workouts', R.workouts.length, T.workouts.length);
  is('backup settings', R.settings.unit, 'lb');
  ok('backup custom exercise', R.exercises.some((e) => e.name === 'Landmine Press'));
  let threw = '';
  try { stateFromBackup({ hello: 1 }); } catch (e) { threw = e.message; }
  ok('reject foreign file', threw.includes('not a Knur Simulator backup'));
  try { stateFromBackup({ format: 'knur-simulator-backup', schema: 99, data: {} }); } catch (e) { threw = e.message; }
  ok('reject newer schema', threw.includes('newer version'));
  is('restored state reseeds', R.exercises.filter((e) => !e.custom).length, nSeed);

  // --- 1.1: tags, history, reports ---
  const G = normalizeState(null);
  const mkW = (daysAgo, exIds, vals, tags) => {
    const id = startWorkout(G);
    const w = workoutById(G, id);

    addExercisesToWorkout(G, id, exIds, false);
    for (const it of w.items) for (const s of it.sets) Object.assign(s, vals[it.exerciseId] || { weightKg: 50, reps: 10 }, { done: true });
    if (tags) w.tags = tags;

  };
  const pushW = mkW(15, [BENCH, slugId('Overhead Press'), TREAD], { [BENCH]: { weightKg: 80, reps: 8 }, [TREAD]: { durationS: 900, distanceM: 2500 } });
  is('auto-tag push + cardio', pushW.tags, ['Push', 'Cardio']);
  const pullW = mkW(13, [ROW, slugId('Lat Pulldown'), slugId('Dumbbell Curl')], {});
  is('auto-tag pull', pullW.tags, ['Pull']);
  const legsW = mkW(11, [slugId('Squat'), slugId('Leg Press')], {});
  is('auto-tag legs', legsW.tags, ['Legs']);
  const cardioW = mkW(9, [slugId('Outdoor Run')], { ex_outdoor_run: { durationS: 1800, distanceM: 5000 } });
  is('auto-tag cardio only', cardioW.tags, ['Cardio']);
  const mixed = mkW(8, [BENCH, ROW], {});
  is('balanced mix: no guess', mixed.tags, []);
  const bench2 = mkW(2, [BENCH], { [BENCH]: { weightKg: 85, reps: 8 } }, ['Push', 'Heavy']);
  is('user tags kept', bench2.tags, ['Push', 'Heavy']);
  is('custom tag listed after defaults', allTags(G), ['Push', 'Pull', 'Legs', 'Cardio', 'Heavy']);
  is('filter by tag', historyList(G, { tag: 'Push' }).map((w) => w.id), [bench2.id, pushW.id]);
  is('filter untagged', historyList(G, { tag: 'Untagged' }).map((w) => w.id), [mixed.id]);
  is('sort oldest', historyList(G, { sort: 'old' })[0].id, pushW.id);
  ok('sort by volume', historyList(G, { sort: 'volume' })[0].items.length >= 2);
  const tplId = createTemplate(G, 'Legs day');
  templateById(G, tplId).tags = ['Legs'];
  const fromTpl = workoutById(G, startWorkout(G, { templateId: tplId }));
  is('template tags copied', fromTpl.tags, ['Legs']);
  deleteWorkout(G, fromTpl.id);
  is('toggle tag', toggleTag(['Push'], 'Cardio'), ['Push', 'Cardio']);
  is('toggle off', toggleTag(['Push', 'Cardio'], 'Push'), ['Cardio']);
  const old = normalizeState({ workouts: [{ id: 'x', name: 'Old', startedAt: 1, finishedAt: 2, items: [{ id: 'i', exerciseId: BENCH, sets: [{ id: 's', kind: 'working', weightKg: 60, reps: 5, done: true }] }] }] });
  is('1.0 data gets tags', old.workouts[0].tags, ['Push']);
  ok('1.0 settings get customTags', Array.isArray(old.settings.customTags));
  const R4 = reportData(G, '4w');
  is('report counts', R4.totals.workouts, 6);
  is('report weeks', R4.weeks.length, 4);
  is('weekly buckets add up', R4.weeks.reduce((a, w) => a + w.count, 0), 6);
  is('tag counts', [R4.tagCounts.Push, R4.tagCounts.Cardio, R4.tagCounts.Untagged], [2, 2, 1]);
  ok('muscle sets', R4.muscleSets.Chest >= 6 && R4.muscleSets.Back >= 3 && !R4.muscleSets.Cardio);
  is('cardio distance', R4.totals.cardioM, 7500);
  is('key lift bench', R4.lifts[0].ex.id, BENCH);
  ok('bench progress positive', R4.lifts[0].changePct > 0);
  ok('records listed', R4.records.some((r) => r.exerciseName === 'Bench Press'));
  ok('streak counts back', R4.streak >= 1);
  is('all-time range starts at first workout', reportData(G, 'all').totals.workouts, 6);
  is('empty report', reportData(normalizeState(null), '12w').totals.workouts, 0);
  is('untagged shown last', R4.tags[R4.tags.length - 1], 'Untagged');

  // --- 1.2: dates, past workouts, drafts, last time ---
  const dt = fromDateTimeInputs('2026-03-05', '07:09');
  is('date input round trip', [toDateInput(dt), toTimeInput(dt)], ['2026-03-05', '07:09']);
  is('bad date', fromDateTimeInputs('05.03.2026', '10:00'), null);
  is('missing time = noon', toTimeInput(fromDateTimeInputs('2026-03-05', '')), '12:00');
  is('fmtDay today', fmtDay(Date.now()), 'Today');
  is('fmtDay yesterday', fmtDay(Date.now() - DAY), 'Yesterday');
  is('last session = closest to today', previousSession(G, BENCH).workoutId, bench2.id);
  is('last session values', previousSession(G, BENCH).sets[0].weightKg, 85);
  is('last session before a date', previousSession(G, BENCH, null, bench2.startedAt).workoutId, mixed.id);
  is('no session before the first', previousSession(G, BENCH, null, pushW.startedAt), null);
  is('library row last sets', listExercises(G).find((e) => e.id === BENCH).lastSets[0].weightKg, 85);
  const pastTs = Date.now() - 10 * DAY;
  const pastId = startPastWorkout(G, { startTs: pastTs, durationS: 2700 });
  const past = workoutById(G, pastId);
  ok('past workout is backdated', past.backdated && past.startedAt === pastTs && !past.finishedAt);
  addExercisesToWorkout(G, pastId, [BENCH], false);
  is('past prefill uses sessions before its date', past.items[0].sets[0].weightKg, 80);
  for (const s of past.items[0].sets) s.done = true;
  finishWorkout(G, pastId);
  is('past finish = start + duration', past.finishedAt - past.startedAt, 2700 * 1000);
  is('history sorted by the past date', historyList(G, { sort: 'new' }).findIndex((w) => w.id === pastId), historyList(G, { sort: 'new' }).findIndex((w) => w.id === cardioW.id) + 1);
  setWorkoutDate(past, pastTs - DAY, null);
  is('moving a finished workout keeps its duration', [past.startedAt, past.finishedAt - past.startedAt], [pastTs - DAY, 2700 * 1000]);
  setWorkoutDate(past, Date.now() + DAY, 600);
  ok('future dates clamp to now', past.startedAt <= Date.now());
  const liveId = startWorkout(G);
  const live = workoutById(G, liveId);
  setWorkoutDate(live, Date.now() - 3600000);
  ok('an hour ago stays live', !live.backdated);
  setWorkoutDate(live, Date.now() - 2 * DAY);
  ok('two days ago becomes a past entry', live.backdated && live.plannedDurationS === 3600);
  const draft = { at: Date.now(), workout: JSON.parse(JSON.stringify(live)), exercises: [{ id: 'ex_mine', name: 'Mine', custom: true, tracking: 'weight_reps', muscle: 'Chest', equipment: 'Other' }] };
  is('no restore while a workout is active', restoreDraft(G, draft), null);
  deleteWorkout(G, liveId);
  is('restore draft', restoreDraft(G, draft), liveId);
  ok('restored draft is in progress', activeWorkout(G) && activeWorkout(G).id === liveId);
  ok('restored draft brings its custom exercise', !!exById(G, 'ex_mine'));
  is('restore twice does nothing', restoreDraft(G, draft), null);
  deleteWorkout(G, liveId);

  // --- 1.3: editing saved workouts ---
  const origJson = JSON.stringify(workoutById(G, bench2.id));
  const ew = startEdit(G, bench2.id);
  ok('edit copy is separate', ew !== workoutById(G, bench2.id) && ew.id === bench2.id);
  ok('unchanged edit', !editChanged(G));
  ew.items[0].sets[0].reps = 9.5;
  ew.items[0].sets[1].done = false;
  addExercisesTo(G, ew, [ROW], false);
  is('added exercise prefilled from before this date', ew.items[1].sets[0].weightKg, 50);
  ok('saved workout untouched while editing', JSON.stringify(workoutById(G, bench2.id)) === origJson);
  ok('edit detected', editChanged(G));
  is('unticked sets counted', editUndone(G), 1 + ew.items[1].sets.length);
  is('startEdit again returns the same copy', startEdit(G, bench2.id) === ew, true);
  ew.items[1].sets[0].done = true;
  const nSets = ew.items[0].sets.length;
  is('save edit', saveEdit(G).ok, true);
  const edSaved = workoutById(G, bench2.id);
  is('edit applied', [edSaved.items[0].sets[0].reps, edSaved.items[0].sets.length, edSaved.items.length], [9.5, nSets - 1, 2]);
  ok('edit cleared and stamped', !G.editing && edSaved.editedAt > 0 && edSaved.finishedAt > edSaved.startedAt);
  const ew2 = startEdit(G, bench2.id);
  ew2.name = 'Changed';
  cancelEdit(G);
  is('cancel keeps the saved workout', workoutById(G, bench2.id).name !== 'Changed' && !G.editing, true);
  const ew3 = startEdit(G, bench2.id);
  for (const it of ew3.items) for (const x of it.sets) x.done = false;
  const r3 = saveEdit(G);
  ok('empty edit not saved', r3.empty && !!G.editing && workoutById(G, bench2.id).items.length === 2);
  cancelEdit(G);
  is('cannot edit an unfinished workout', startEdit(G, startWorkout(G)), null);
  deleteWorkout(G, activeWorkout(G).id);
  is('orphan edit copy dropped on load', normalizeState({ workouts: [], editing: { w: { id: 'gone', items: [] } } }).editing, null);

  const result = { passed, failed: failures.length, failures };
  if (!quiet && typeof console !== 'undefined') {
    console.log(`Knur Simulator self-test: ${passed} passed, ${failures.length} failed`);
    failures.forEach((f) => console.warn('FAIL ' + f));
  }
  return result;
};

/** Eight weeks of sample training (3×/week, Push/Pull/Legs + cardio). KS.demo() or ?demo=1 */
KS.demo = function demo() {
  const E = (n) => slugId(n);
  const mk = (name, items) => {
    const id = createTemplate(S, name);
    const t = templateById(S, id);
    for (const [ex, sets, repMin, repMax, ss] of items) {
      const e = exById(S, E(ex));
      const it = { ...makeTemplateItem(e, ss || null), sets, repMin, repMax };
      if (e.tracking === 'cardio') Object.assign(it, { sets: 1, repMin: null, repMax: null, durationS: repMin * 60 });
      t.items.push(it);
    }
    normalizeItems(t.items);
    return t;
  };
  const tag = (t, tags) => { t.tags = tags; return t; };
  const push = mk('Push A', [['Bench Press', 4, 6, 8], ['Overhead Press', 3, 8, 10], ['Incline Dumbbell Press', 3, 8, 12], ['Lateral Raise', 3, 12, 15, 'a'], ['Triceps Pushdown', 3, 10, 12, 'a'], ['Treadmill', 1, 15]]);
  const pull = mk('Pull A', [['Pull-up', 4, 6, 10], ['Barbell Row', 4, 6, 8], ['Lat Pulldown', 3, 10, 12, 'b'], ['Face Pull', 3, 12, 15, 'b'], ['Dumbbell Curl', 3, 10, 12]]);
  const legs = mk('Legs', [['Squat', 4, 5, 8], ['Romanian Deadlift', 3, 8, 10], ['Leg Press', 3, 10, 12], ['Standing Calf Raise', 4, 12, 15], ['Stationary Bike', 1, 20]]);
  const base = { 'Bench Press': 70, 'Overhead Press': 40, 'Incline Dumbbell Press': 24, 'Lateral Raise': 8, 'Triceps Pushdown': 25, 'Barbell Row': 60, 'Lat Pulldown': 55, 'Face Pull': 20, 'Dumbbell Curl': 12, Squat: 90, 'Romanian Deadlift': 80, 'Leg Press': 160, 'Standing Calf Raise': 60 };
  tag(push, ['Push', 'Cardio']); tag(pull, ['Pull']); tag(legs, ['Legs', 'Cardio']);
  const cardioDay = tag(mk('Cardio', [['Outdoor Run', 1, 30], ['Rowing Machine', 1, 12]]), ['Cardio']);
  const plan = [push, pull, legs];
  const day = 86400000;
  const start = new Date();
  start.setHours(18, 0, 0, 0);
  let n = 0;
  for (let week = 8; week >= 1; week--) {
    for (const [k, off] of [[0, 0], [1, 2], [2, 4]]) {
      const t = plan[k];
      const ts = start.getTime() - week * 7 * day + off * day;
      const w = { id: newId(), templateId: t.id, name: t.name, startedAt: ts, finishedAt: ts + (55 + (n % 4) * 5) * 60000, notes: null, tags: [...t.tags], items: [] };
      const prog = 8 - week;
      for (const ti of t.items) {
        const ex = exById(S, ti.exerciseId);
        const it = { id: newId(), exerciseId: ex.id, superset: ti.superset, restS: null, notes: null, sets: [] };
        if (ex.tracking === 'cardio') {
          const dur = (ti.durationS || 900) + prog * 30;
          it.sets.push({ ...makeSet({ durationS: dur, distanceM: Math.round((dur / 60) * (ex.name === 'Treadmill' ? 160 : 420) * (1 + prog * 0.01)), calories: Math.round(dur / 6) }), done: true, doneAt: ts });
        } else if (ex.tracking === 'bodyweight_reps') {
          for (let s = 0; s < ti.sets; s++) it.sets.push({ ...makeSet({ reps: Math.max(4, 7 + Math.floor(prog / 2) - s) }), done: true, doneAt: ts });
        } else {
          const b = base[ex.name] || 20;
          const inc = b >= 50 ? 2.5 : 1;
          const wt = b + Math.floor(prog / 2) * inc;
          for (let s = 0; s < ti.sets; s++) it.sets.push({ ...makeSet({ weightKg: wt, reps: Math.max(ti.repMin, ti.repMax - s - (prog % 2)) }), done: true, doneAt: ts });
        }
        w.items.push(it);
      }
      S.workouts.push(w);
      n++;
    }
    if (week % 2 === 0) {
      // Every other Saturday: a cardio-only session.
      const ts = start.getTime() - week * 7 * day + 5 * day - 8 * 3600000;
      const w = { id: newId(), templateId: cardioDay.id, name: 'Cardio', startedAt: ts, finishedAt: ts + 45 * 60000, notes: null, tags: ['Cardio'], items: [] };
      for (const ti of cardioDay.items) {
        const dur = ti.durationS + (8 - week) * 45;
        const pace = ti.exerciseId === 'ex_outdoor_run' ? 170 - (8 - week) : 400;
        w.items.push({ id: newId(), exerciseId: ti.exerciseId, superset: null, restS: null, notes: null, sets: [{ ...makeSet({ durationS: dur, distanceM: Math.round((dur / 60) * pace), calories: Math.round(dur / 5) }), done: true, doneAt: ts }] });
      }
      S.workouts.push(w);
      n++;
    }
  }
  Store.flush();
  if (typeof render === 'function') render();
  return n;
};

function registerServiceWorker() {
  if (!ROOT.KS_SITE || !('serviceWorker' in navigator) || !/^https?:/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    Store.flush().then(() => {
      toast('Updated to the latest version');
      setTimeout(() => location.reload(), 700);
    });
  });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function boot() {
  const { state, fresh, failed } = await Store.load();
  S = state;
  if (failed) {
    // Couldn't read storage: show the warning, write nothing.
    render();
    registerServiceWorker();
    return;
  }
  // A draft of an in-progress workout that isn't in the main data (e.g. the save was lost).
  const draft = await Store.loadDraft();
  if (draft) {
    const known = workoutById(S, draft.workout.id);
    if (known && known.finishedAt) await Store.clearDraft();
    else if (!known && !activeWorkout(S)) { ui.pendingDraft = draft; Store.keepDraft = true; }
  }
  const hasData = S.workouts.length || S.templates.length || S.exercises.some((e) => e.custom);
  if (S.settings.lastVersion !== APP.version) {
    // First launch of a new version: keep a copy of the data exactly as the old version left it.
    if (!fresh && hasData) await Store.snapshotAuto('update', `Before update to ${APP.version}${S.settings.lastVersion ? ` (from ${S.settings.lastVersion})` : ''}`);
    S.settings.lastVersion = APP.version;
    await Store.flush();
  } else if (fresh) {
    await Store.flush();
  }
  await Store.dailySnapshot();
  Store.persist();

  if (/[?&]demo=1\b/.test(location.search) && !S.workouts.length) KS.demo();
  if (S.restTimer) Rest.ensureTicking();
  render();
  registerServiceWorker();
}
boot();

</script>
</body>
