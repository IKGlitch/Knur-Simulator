<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knur Simulator</title>
<meta name="description" content="Gym planner and workout log. Offline, on your phone.">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knur">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #0B0B0C; --surface: #141416; --surface2: #1C1C1F; --surface3: #26262A; --border: #2A2A2E;
  --text: #F2F2F3; --dim: #9A9AA2; --faint: #5E5E66;
  /* purple: --fill for solid surfaces (buttons, chips, ticks), --accent for text/icons/borders on dark */
  --fill: #6D28D9; --accent: #A78BFA; --accent-dim: rgba(109,40,217,.17); --on-accent: #FFFFFF; --badge-ink: #0B0B0C;
  /* tag / chart series colours (validated categorical order, dark steps) */
  --t-push: #3987e5; --t-pull: #d95926; --t-legs: #199e70; --t-cardio: #c98500; --t-5: #d55181; --t-6: #008300; --t-7: #9085e9; --t-8: #e66767; --t-other: #6b6b73;
  --danger: #FF5A5F; --danger-dim: rgba(255,90,95,.12); --cardio: #E0A83A; --warm: #FF9F0A;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --tabs-h: 56px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { min-height: 100vh; overscroll-behavior-y: none; font-size: 16px; line-height: 1.35; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
/* 16px+ on inputs stops iOS zooming in on focus */
input, textarea, select { font-size: 17px; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); }
svg { width: 20px; height: 20px; flex: none; }
svg.chart { width: 100%; height: auto; display: block; }
.hidden { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); } .faint { color: var(--faint); } .accent { color: var(--accent); } .cardio { color: var(--cardio); } .danger { color: var(--danger); }
.small { font-size: 13px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
.caps { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--dim); }
.row { display: flex; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; } .grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }

/* ---------- layout ---------- */
#top { position: sticky; top: 0; z-index: 20; background: rgba(11,11,12,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: calc(var(--sat) + 6px) 12px 6px; min-height: calc(var(--sat) + 50px); display: flex; align-items: center; gap: 8px; }
#top .t-title { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 17px; }
#top .t-side { min-width: 72px; display: flex; align-items: center; }
#top .t-side.right { justify-content: flex-end; }
#top.large .t-title { text-align: left; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
#top.large .t-side.left { display: none; }
#view { padding: 4px 16px calc(var(--tabs-h) + var(--sab) + 32px); max-width: 640px; margin: 0 auto; }
body.no-tabs #view { padding-bottom: calc(var(--sab) + 120px); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: rgba(11,11,12,.95);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding-bottom: var(--sab); }
body.no-tabs #tabs { display: none; }
#tabs a { flex: 1; min-width: 0; height: var(--tabs-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--faint); text-decoration: none; font-size: 11px; font-weight: 600; }
#tabs a.on { color: var(--accent); }
#tabs svg { width: 24px; height: 24px; }

/* ---------- controls ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: var(--r-md);
  font-weight: 700; font-size: 16px; background: var(--surface2); color: var(--text); width: 100%; }
.btn.primary { background: var(--fill); color: var(--on-accent); }
.btn.danger { background: var(--danger-dim); color: var(--danger); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0 14px; border-radius: var(--r-sm); font-size: 15px; width: auto; }
.btn:active { opacity: .7; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 19px; color: var(--dim); }
.icon-btn:active { background: var(--surface2); }
.icon-btn svg { width: 22px; height: 22px; }
.link { color: var(--accent); font-weight: 600; font-size: 15px; }
.back { color: var(--accent); display: inline-flex; align-items: center; font-size: 17px; margin-left: -6px; }
.back svg { width: 26px; height: 26px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; }
.card.tap:active { background: var(--surface2); }
.card.accent-border { border-color: var(--accent); }
.stack > * + * { margin-top: 8px; }
.section { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px; }
.chip { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--dim); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--fill); border-color: var(--fill); color: var(--on-accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.pill { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--surface3); color: var(--dim); font-size: 11px; font-weight: 700; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 12px; font-weight: 800; color: var(--badge-ink); }
.stats { display: flex; gap: 8px; } .stats > div { flex: 1; min-width: 0; }
.stat-v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; } .stat-l { font-size: 12px; color: var(--dim); }
.field { width: 100%; height: 50px; padding: 0 14px; border-radius: var(--r-md); border: 0; background: var(--surface2); outline: none; }
.field:focus { box-shadow: 0 0 0 2px var(--accent); }
input.field[type=date], input.field[type=time] { -webkit-appearance: none; appearance: none; display: flex; align-items: center; font-size: 17px; color: var(--text); min-width: 0; }
input.field[type=date]::-webkit-date-and-time-value, input.field[type=time]::-webkit-date-and-time-value { text-align: left; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.banner { border-radius: var(--r-lg); padding: 14px 16px; border: 1px solid var(--border); background: var(--surface); }
.banner.warn { border-color: var(--danger); background: var(--danger-dim); }
.banner.info { border-color: var(--accent); }
.date-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; margin: 0 0 10px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); }
.date-row svg { width: 18px; height: 18px; color: var(--accent); flex: 0 0 auto; }
.date-row.past { border-color: var(--accent); }
.last-time { font-size: 13px; color: var(--dim); padding: 0 2px 6px; }
.last-time b { color: var(--text); font-weight: 600; }
.draft-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.draft-bar .btn { flex: 1; }

textarea.field { height: auto; min-height: 44px; padding: 10px 12px; resize: none; font-size: 16px; line-height: 1.35; }
.title-input { width: 100%; background: transparent; border: 0; outline: none; font-size: 28px; font-weight: 800; letter-spacing: -.02em; padding: 4px 0; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: var(--r-sm); background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--dim); }
.avatar.cardio { background: rgba(224,168,58,.12); color: var(--cardio); }
.avatar svg { width: 18px; height: 18px; }
.empty { text-align: center; padding: 56px 24px; color: var(--dim); }
.empty svg { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); font-size: 18px; margin: 12px 0 4px; }
.setting { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.setting:last-child { border-bottom: 0; }
.setting svg { width: 20px; height: 20px; color: var(--dim); flex: 0 0 20px; }
.setting .chev { width: 16px; height: 16px; color: var(--faint); }
.switch { position: relative; width: 50px; height: 30px; flex: 0 0 50px; border-radius: 15px; background: var(--surface3); transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: var(--text); transition: transform .15s; }
.switch.on { background: var(--fill); } .switch.on::after { transform: translateX(20px); background: var(--on-accent); }

/* ---------- workout ---------- */
.ex { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px 4px; margin-bottom: 12px; }
.ex.ss { border-left-width: 3px; }
.ex.linked-below { margin-bottom: 2px; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
.ex.linked-above { border-top-left-radius: 4px; border-top-right-radius: 4px; }
.ex-head { display: flex; align-items: center; gap: 8px; padding: 0 8px 4px; }
.ex-name { font-size: 18px; font-weight: 700; }
.sets { width: 100%; border-collapse: separate; border-spacing: 0 3px; table-layout: fixed; }
.sets th { font-size: 10px; letter-spacing: .06em; color: var(--faint); font-weight: 700; padding: 2px 0; }
.sets td { padding: 0 3px; text-align: center; }
.sets tr.done td { background: var(--accent-dim); }
.sets tr.done td:first-child { border-radius: 8px 0 0 8px; } .sets tr.done td:last-child { border-radius: 0 8px 8px 0; }
.c-set { width: 34px; } .c-prev { width: 76px; } .c-chk { width: 50px; }
.set-no { font-weight: 700; color: var(--dim); height: 40px; width: 100%; }
.set-no.warmup { color: var(--warm); } .set-no.drop { color: #5AC8FA; } .set-no.failure { color: var(--danger); }
.prev { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { width: 100%; height: 40px; border: 0; border-radius: 8px; background: var(--surface2); text-align: center; font-weight: 600;
  font-variant-numeric: tabular-nums; outline: none; padding: 0 2px; font-size: 17px; }
.num::placeholder { color: var(--faint); font-weight: 500; }
.num:focus { box-shadow: 0 0 0 2px var(--accent); }
tr.done .num { background: transparent; }
.chk { width: 44px; height: 38px; border-radius: 8px; background: var(--surface3); color: var(--faint); display: inline-flex; align-items: center; justify-content: center; }
.chk svg { width: 20px; height: 20px; }
tr.done .chk { background: var(--fill); color: var(--on-accent); }
.pace { text-align: right; padding-right: 56px; font-size: 12px; color: var(--dim); }
.add-set svg { width: 16px; height: 16px; }
.add-set { display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; margin: 8px 8px 0; border-radius: 8px; background: var(--surface2); color: var(--dim); font-weight: 600; font-size: 14px; width: calc(100% - 16px); }
.note { width: calc(100% - 16px); margin: 0 8px 8px; min-height: 40px; padding: 8px 10px; border-radius: 8px; border: 0; background: var(--surface2); font-size: 16px; resize: none; outline: none; }
#restbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface2); border-top: 1px solid var(--border); padding: 12px 12px calc(12px + var(--sab)); display: none; }
#restbar.show { display: block; }
#restbar .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }
#restbar .adj { min-width: 56px; height: 42px; border-radius: 8px; background: var(--surface3); font-weight: 700; font-size: 15px; }
#restbar .adj.skip { background: var(--fill); color: var(--on-accent); }
#restbar .time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
#restbar.flash { animation: flash .5s 3; }
@keyframes flash { 50% { background: var(--fill); color: var(--on-accent); } }
.finish-btn { background: var(--fill); color: var(--on-accent); font-weight: 700; border-radius: 8px; height: 34px; padding: 0 14px; font-size: 15px; }

/* ---------- progress ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.tile-v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-l { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.hbars { display: flex; flex-direction: column; gap: 6px; }
.hb-row { display: grid; grid-template-columns: 86px 1fr 40px; align-items: center; gap: 8px; font-size: 14px; }
.hb-track { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.hb-bar { height: 100%; border-radius: 5px; }
.hb-val { text-align: right; color: var(--dim); }
.rtable { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.rtable th { font-size: 11px; color: var(--dim); font-weight: 700; text-align: right; padding: 4px; }
.rtable td { text-align: right; padding: 5px 4px; border-top: 1px solid var(--border); }
.rtable th:first-child, .rtable td:first-child { text-align: left; }
.tip { min-height: 18px; margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--surface2); font-size: 12px; font-weight: 600; color: var(--text); }
.tag .sw { width: 8px; height: 8px; border-radius: 4px; }
.chip .sw { margin-right: 6px; }

/* ---------- template editor ---------- */
.stepper { display: flex; align-items: center; justify-content: space-between; height: 40px; border-radius: 8px; background: var(--surface2); }
.stepper button { width: 34px; height: 40px; font-size: 20px; font-weight: 600; }
.flabel { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: .06em; text-align: center; margin-bottom: 3px; }

/* ---------- overlays ---------- */
#layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); pointer-events: auto; animation: fade .15s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; background: var(--surface); border-radius: 16px 16px 0 0; pointer-events: auto;
  display: flex; flex-direction: column; padding-bottom: var(--sab); animation: up .2s ease-out; max-width: 640px; margin: 0 auto; }
.sheet.full { top: calc(var(--sat) + 12px); max-height: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.sheet-head h2 { flex: 1; font-size: 17px; text-align: center; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; flex: 1; }
.sheet-foot { padding: 12px 16px; border-top: 1px solid var(--border); }
.menu { padding: 8px 12px 12px; }
.menu h3 { font-size: 13px; color: var(--dim); text-align: center; font-weight: 600; padding: 8px 0 10px; }
.menu button { display: block; width: 100%; min-height: 52px; background: var(--surface2); font-size: 17px; text-align: center; }
.menu button + button { border-top: 1px solid var(--border); }
.menu button:first-of-type { border-radius: 12px 12px 0 0; } .menu button:last-of-type { border-radius: 0 0 12px 12px; }
.menu button:only-of-type { border-radius: 12px; }
.menu button.destructive { color: var(--danger); }
.menu .cancel { margin-top: 8px; border-radius: 12px !important; font-weight: 700; border-top: 0 !important; }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(320px, calc(100vw - 48px)); background: var(--surface2);
  border-radius: 16px; pointer-events: auto; overflow: hidden; animation: pop .15s; }
.dialog .d-body { padding: 20px 18px 16px; text-align: center; }
.dialog h3 { font-size: 17px; margin-bottom: 6px; } .dialog p { color: var(--dim); font-size: 14px; white-space: pre-line; }
.dialog .d-btns { display: flex; border-top: 1px solid var(--border); }
.dialog .d-btns button { flex: 1; height: 48px; font-size: 17px; color: var(--accent); }
.dialog .d-btns button + button { border-left: 1px solid var(--border); font-weight: 700; }
.dialog .d-btns button.destructive { color: var(--danger); }
.dialog .field { margin-top: 12px; height: 44px; background: var(--surface3); }
#toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + var(--sab) + 16px); transform: translateX(-50%); z-index: 200; background: var(--surface3);
  color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4);
  opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; }
body.no-tabs #toast { bottom: calc(var(--sab) + 100px); }
.sel-bar { display: flex; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: var(--r-md); padding: 0 12px; }
.search input { flex: 1; height: 44px; border: 0; background: transparent; outline: none; }
.search svg { width: 18px; height: 18px; color: var(--faint); }
.check { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.check.on { background: var(--fill); border-color: var(--fill); color: var(--on-accent); }
.install { border: 1px dashed var(--accent); }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(40px); opacity: .5; } } @keyframes pop { from { transform: translate(-50%, -48%) scale(.96); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<header id="top"></header>
<main id="view"></main>
<div id="restbar"></div>
<nav id="tabs"></nav>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
window.KS_SITE = true;
/* ---- 02_core.js ---- */
'use strict';
/* ==========================================================================
   02_core — namespace, ids, parsing, units, formatting. DOM-free (runs in Node
   for the test runner).
   ========================================================================== */
const ROOT = typeof window !== 'undefined' ? window : globalThis;
const APP = { name: 'Knur Simulator', short: 'Knur', version: '1.3.0', built: '2026-09-23' };
const KS = (ROOT.KS = ROOT.KNUR = ROOT.KS || { APP });
KS.APP = APP;

// ---------- ids ----------
let _idCounter = 0;
/** Short, sortable, collision-resistant text id. */
function newId() {
  _idCounter = (_idCounter + 1) % 1296;
  return (
    Date.now().toString(36) +
    _idCounter.toString(36).padStart(2, '0') +
    Math.random().toString(36).slice(2, 8).padEnd(6, '0')
  );
}

// ---------- parsing (phone keypads: Polish iPhones type a comma) ----------
const VULGAR = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': 0.125 };
/**
 * "82,5" | "82.5" | " 100 " | "8 1/2" | "8½" | "1/2" → number; "" / junk → null.
 * Fractions are for half reps and small plates.
 */
function parseNumber(input) {
  if (input == null) return null;
  let s = String(input).trim().replace(',', '.');
  if (s === '') return null;
  // Unicode fractions: "8½" → 8.5, "½" → 0.5
  const vm = /^(-?\d*)\s*([½¼¾⅓⅔⅛])$/.exec(s);
  if (vm) {
    const whole = vm[1] === '' || vm[1] === '-' ? 0 : Math.abs(Number(vm[1]));
    return (vm[1].startsWith('-') ? -1 : 1) * (whole + VULGAR[vm[2]]);
  }
  // "8 1/2", "8-1/2", "1/2"
  const fm = /^(?:(\d+)[\s-]+)?(\d+)\/(\d+)$/.exec(s);
  if (fm) {

  storedWorkouts: 0, // finished workouts in the last good read or write
  lastSavedAt: 0,
  lastDraftAt: 0,
  keepDraft: false, // an orphan draft is waiting for Restore / Discard: don't clear it

  open(force = false) {

    }
    if (this._db) return Promise.resolve(this._db);
    if (typeof indexedDB === 'undefined') return Promise.resolve(null);
    return new Promise((resolve) => {
      let req;
      try {

      req.onsuccess = () => {

      req.onblocked = () => { clearTimeout(timer); resolve(null); };

  /** One IndexedDB request, retried once on a fresh connection. Resolves {ok, value}. */
  async _req(mode, fn) {

      const res = await new Promise((resolve) => {

          if (r) r.onsuccess = () => (value = r.result);
          tx.oncomplete = () => resolve({ ok: true, value });

  },
  idbGet(key) { return this._req('readonly', (st) => st.get(key)); },
  async idbSet(key, value) { return (await this._req('readwrite', (st) => st.put(value, key))).ok; },
  async idbDel(key) { return (await this._req('readwrite', (st) => st.delete(key))).ok; },
  async idbKeys() { const r = await this._req('readonly', (st) => st.getAllKeys()); return r.ok ? r.value || [] : []; },

  /**
   * Newest of the IndexedDB copy and the localStorage mirror, normalised.
   * Returns {state, fresh, failed}. `failed` = couldn't read and can't be sure there's no data.
   */
  async load() {
    let fromIdb = null;
    let fromLs = null;
    let idbOk = false;
    for (let attempt = 0; attempt < 3 && !idbOk; attempt++) {
      if (attempt) await new Promise((r) => setTimeout(r, 400 * attempt));
      const res = await this.idbGet('state');
      if (res.ok) {
        idbOk = true;

      }
    }
    let lsOk = true;
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) fromLs = JSON.parse(raw);
    } catch (e) {
      lsOk = false;
    }
    const pick = !fromIdb ? fromLs : !fromLs ? fromIdb : (fromLs.savedAt || 0) > (fromIdb.savedAt || 0) ? fromLs : fromIdb;
    // Nothing read AND IndexedDB unreadable: we can't tell "new install" from "read failed".
    const failed = !pick && (!idbOk || !lsOk) && typeof indexedDB !== 'undefined';
    this.readOnly = failed;

    this.storedWorkouts = state.workouts.filter((w) => w.finishedAt).length;

  },

  /** Debounced save of the global state. */
  save() {
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.flush(), 250);
  },
  async flush() {
    clearTimeout(this._timer);
    if (!S) return false;
    if (this.readOnly) {
      this.lastError = 'Saved data could not be read, so saving is paused to protect it. Close and reopen the app.';
      return false;
    }
    const finished = S.workouts.filter((w) => w.finishedAt).length;
    if (finished < this.storedWorkouts && !this.allowShrink) {
      // Something tried to save fewer workouts than are stored, without the user deleting any.
      this.lastError = 'Blocked a save that would have removed workouts.';
      console.warn(this.lastError, finished, '<', this.storedWorkouts);
      return false;
    }
    this.allowShrink = false;
    S.savedAt = Date.now();
    const json = JSON.stringify(S);
    // localStorage first: it's synchronous, so it completes even when the page is
    // closing (pagehide / reload), where an IndexedDB write may be cut off.
    let lsOk = false;
    try {
      localStorage.setItem(LS_KEY, json);

    } catch (e) {
      // Quota: large histories may not fit in localStorage. IndexedDB still has it.
      try { localStorage.removeItem(LS_KEY); } catch (e2) { /* ignore */ }
    }
    const ok = await this.idbSet('state', json);
    const saved = ok || lsOk;
    this.lastError = saved ? null : 'Could not save to this device.';

      this.storedWorkouts = finished;
      this.lastSavedAt = S.savedAt;
    }
    await this.saveDraft();

  },
  /** Called before a deliberate removal (delete workout, erase, restore, undo). */
  permitShrink() {
    this.allowShrink = true;
  },

  // ---------- draft of the in-progress workout ----------
  /** Small separate copy of the active workout (+ custom exercises it uses). */
  async saveDraft({ manual = false } = {}) {
    if (!S || this.readOnly) return false;
    const w = activeWorkout(S);
    if (!w) {
      if (!this.keepDraft) await this.clearDraft();
      return true;
    }
    const exIds = new Set(w.items.map((i) => i.exerciseId));
    const draft = { at: Date.now(), manual, workout: w, exercises: S.exercises.filter((e) => e.custom && exIds.has(e.id)) };
    const json = JSON.stringify(draft);
    let ok = false;
    try { localStorage.setItem(LS_DRAFT, json); ok = true; } catch (e) { /* ignore */ }
    ok = (await this.idbSet('draft', json)) || ok;
    if (ok) this.lastDraftAt = draft.at;
    return ok;
  },
  async loadDraft() {
    let a = null;
    let b = null;
    try { const raw = localStorage.getItem(LS_DRAFT); if (raw) a = JSON.parse(raw); } catch (e) { /* ignore */ }
    const r = await this.idbGet('draft');
    try { if (r.ok && r.value) b = JSON.parse(r.value); } catch (e) { /* ignore */ }
    const d = !a ? b : !b ? a : (a.at || 0) >= (b.at || 0) ? a : b;
    return d && d.workout ? d : null;
  },
  async clearDraft() {
    this.keepDraft = false;
    try { localStorage.removeItem(LS_DRAFT); } catch (e) { /* ignore */ }
    await this.idbDel('draft');
    this.lastDraftAt = 0;
  },

  // ---------- restore point + automatic snapshots ----------
  /** One restore point, overwritten each time (taken before restore / erase). */
  async snapshot(reason) {
    const point = { at: Date.now(), reason, counts: stateCounts(S), state: JSON.stringify(S) };
    return this.idbSet('restorepoint', point);
  },
  async restorePoint() {
    const r = await this.idbGet('restorepoint');
    return r.ok && r.value && r.value.state ? r.value : null;
  },
  /** kind: 'daily' | 'update'. Stored under snap:<kind>:<id>. */
  async snapshotAuto(kind, reason, id = String(Date.now())) {
    if (!S) return false;
    const snap = { at: Date.now(), kind, reason, version: APP.version, counts: stateCounts(S), state: JSON.stringify(S) };
    const ok = await this.idbSet(`snap:${kind}:${id}`, snap);
    await this.pruneSnapshots();
    return ok;
  },
  async pruneSnapshots() {
    const keys = (await this.idbKeys()).filter((k) => typeof k === 'string' && k.startsWith('snap:'));
    const byKind = {};
    for (const k of keys) (byKind[k.split(':')[1]] = byKind[k.split(':')[1]] || []).push(k);
    const keep = { daily: DAILY_KEEP, update: UPDATE_KEEP };
    for (const [kind, list] of Object.entries(byKind)) {
      list.sort().reverse(); // ids sort by date/time
      for (const k of list.slice(keep[kind] ?? 3)) await this.idbDel(k);
    }
  },
  /** All automatic snapshots, newest first (metadata only). */
  async listSnapshots() {
    const keys = (await this.idbKeys()).filter((k) => typeof k === 'string' && k.startsWith('snap:'));
    const out = [];
    for (const k of keys) {
      const r = await this.idbGet(k);
      if (r.ok && r.value) out.push({ key: k, at: r.value.at, kind: r.value.kind, reason: r.value.reason, version: r.value.version, counts: r.value.counts });

    return out.sort((a, b) => b.at - a.at);
  },
  async getSnapshot(key) {
    const r = await this.idbGet(key);
    return r.ok && r.value && r.value.state ? r.value : null;
  },
  /** Once per day, on first open, before anything changes. */
  async dailySnapshot() {
    if (!S || this.readOnly || !S.workouts.length) return false;
    const d = new Date();
    const id = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

  },

    } catch (e) { /* ignore */ }

  },
  async isPersisted() {

    } catch (e) { /* ignore */ }

/* ==========================================================================
   02e_reports — workout tags (Push / Pull / Legs / Cardio + your own),
   history sorting & filtering, and the numbers behind the Progress tab.
   DOM-free.
   ========================================================================== */
const DEFAULT_TAGS = ['Push', 'Pull', 'Legs', 'Cardio'];
const TAG_MUSCLES = {
  Push: ['Chest', 'Shoulders', 'Triceps'],
  Pull: ['Back', 'Biceps'],
  Legs: ['Quads', 'Hamstrings', 'Glutes', 'Calves'],
};
// Series colours follow the tag, never its rank (fixed categorical order).
const TAG_COLOR_VARS = { Push: 'var(--t-push)', Pull: 'var(--t-pull)', Legs: 'var(--t-legs)', Cardio: 'var(--t-cardio)' };
const EXTRA_COLOR_VARS = ['var(--t-5)', 'var(--t-6)', 'var(--t-7)', 'var(--t-8)'];

/** Every tag in use: the four defaults first, then your own in the order you added them. */
function allTags(S) {
  const seen = new Set(DEFAULT_TAGS);
  const out = [...DEFAULT_TAGS];
  const add = (t) => { if (t && !seen.has(t)) { seen.add(t); out.push(t); } };
  (S.settings.customTags || []).forEach(add);
  S.templates.forEach((t) => (t.tags || []).forEach(add));
  S.workouts.forEach((w) => (w.tags || []).forEach(add));
  return out;
}
function tagColor(S, tag) {
  if (TAG_COLOR_VARS[tag]) return TAG_COLOR_VARS[tag];
  const custom = allTags(S).filter((t) => !TAG_COLOR_VARS[t]);
  const i = custom.indexOf(tag);
  return i >= 0 && i < EXTRA_COLOR_VARS.length ? EXTRA_COLOR_VARS[i] : 'var(--t-other)';
}

/**
 * Guess tags from what was trained. `items` are workout items (with sets) or
 * template items (with a set count). Push/Pull/Legs by majority of sets;
 * Cardio when a cardio exercise is in it.
 */
function inferTags(S, items) {
  const count = { Push: 0, Pull: 0, Legs: 0 };
  let strength = 0;
  let cardio = false;
  for (const it of items) {
    const ex = exById(S, it.exerciseId);
    if (!ex) continue;
    if (ex.tracking === 'cardio') { cardio = true; continue; }
    const n = Array.isArray(it.sets) ? it.sets.filter((s) => s.done !== false).length : it.sets || 1;
    strength += n;
    for (const [tag, muscles] of Object.entries(TAG_MUSCLES)) if (muscles.includes(ex.muscle)) count[tag] += n;
  }
  const tags = [];
  const best = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
  if (strength && best[1] > strength * 0.5) tags.push(best[0]); // clear majority only
  if (cardio) tags.push('Cardio');
  return tags;
}
function toggleTag(list, tag) {
  const i = list.indexOf(tag);
  if (i >= 0) list.splice(i, 1);
  else list.push(tag);
  return list;
}

// ---------- history ----------
const HISTORY_SORTS = [
  { id: 'new', label: 'Newest first' },
  { id: 'old', label: 'Oldest first' },
  { id: 'long', label: 'Longest first' },
  { id: 'volume', label: 'Most volume first' },
];
/** Finished workouts filtered by tag ('All' | 'Untagged' | tag) and sorted. */
function historyList(S, { tag = 'All', sort = 'new' } = {}) {
  let l = S.workouts.filter((w) => w.finishedAt);
  if (tag === 'Untagged') l = l.filter((w) => !(w.tags || []).length);
  else if (tag && tag !== 'All') l = l.filter((w) => (w.tags || []).includes(tag));
  const dur = (w) => w.finishedAt - w.startedAt;
  const vol = new Map(l.map((w) => [w.id, sort === 'volume' ? workoutStats(S, w).volumeKg : 0]));
  const cmp = {
    new: (a, b) => b.startedAt - a.startedAt,
    old: (a, b) => a.startedAt - b.startedAt,
    long: (a, b) => dur(b) - dur(a) || b.startedAt - a.startedAt,
    volume: (a, b) => vol.get(b.id) - vol.get(a.id) || b.startedAt - a.startedAt,
  }[sort] || ((a, b) => b.startedAt - a.startedAt);
  return l.sort(cmp);
}

// ---------- progress report ----------
const REPORT_RANGES = [
  { id: '4w', label: '4 weeks', weeks: 4 },
  { id: '12w', label: '12 weeks', weeks: 12 },
  { id: '6m', label: '6 months', weeks: 26 },
  { id: '1y', label: '1 year', weeks: 52 },
  { id: 'all', label: 'All time', weeks: null },
];
const WEEK_MS = 7 * 86400000;

/** Everything the Progress tab shows, for one range. `now` is injectable for tests. */
function reportData(S, rangeId = '12w', now = Date.now()) {
  const range = REPORT_RANGES.find((r) => r.id === rangeId) || REPORT_RANGES[1];
  const done = S.workouts.filter((w) => w.finishedAt).sort((a, b) => a.startedAt - b.startedAt);
  const thisWeek = startOfWeek(now);
  const firstWeek = range.weeks ? thisWeek - (range.weeks - 1) * WEEK_MS : done.length ? startOfWeek(done[0].startedAt) : thisWeek;
  const list = done.filter((w) => w.startedAt >= firstWeek);
  const nWeeks = Math.max(1, Math.round((thisWeek - firstWeek) / WEEK_MS) + 1);

  // Week buckets (DST-safe: bucket by startOfWeek of each workout).
  const weeks = [];
  const index = new Map();
  for (let i = 0; i < nWeeks; i++) {
    const start = startOfWeek(firstWeek + i * WEEK_MS + 3 * 86400000);
    index.set(start, weeks.length);
    weeks.push({ start, count: 0, byTag: {}, volumeKg: 0, cardioS: 0, durationS: 0 });
  }
  const totals = { workouts: list.length, durationS: 0, volumeKg: 0, sets: 0, cardioS: 0, cardioM: 0 };
  const tagCounts = {};
  const muscleSets = {};
  for (const w of list) {
    const st = workoutStats(S, w);
    const wk = weeks[index.get(startOfWeek(w.startedAt))];
    const primary = (w.tags && w.tags[0]) || 'Untagged';
    totals.durationS += st.durationS;
    totals.volumeKg += st.volumeKg;
    totals.sets += st.sets;
    totals.cardioS += st.cardioS;
    for (const t of w.tags && w.tags.length ? w.tags : ['Untagged']) tagCounts[t] = (tagCounts[t] || 0) + 1;
    if (wk) {
      wk.count++;
      wk.byTag[primary] = (wk.byTag[primary] || 0) + 1;
      wk.volumeKg += st.volumeKg;
      wk.cardioS += st.cardioS;
      wk.durationS += st.durationS;
    }
    for (const it of w.items) {
      const ex = exById(S, it.exerciseId);
      if (!ex) continue;
      for (const s of it.sets) {
        if (!s.done) continue;
        if (ex.tracking === 'cardio') { totals.cardioM += s.distanceM || 0; continue; }
        if (s.kind === 'warmup') continue;
        const m = ex.muscle || 'Other';
        muscleSets[m] = (muscleSets[m] || 0) + 1;
      }
    }
  }

  // Streak: consecutive weeks with ≥1 workout, ending this week (or last week if this one is still empty).
  const weeksWithWork = new Set(done.map((w) => startOfWeek(w.startedAt)));
  let streak = 0;
  let cursor = weeksWithWork.has(thisWeek) ? thisWeek : startOfWeek(thisWeek - 3 * 86400000);
  while (weeksWithWork.has(cursor)) {
    streak++;
    cursor = startOfWeek(cursor - 3 * 86400000);
  }

  // Key lifts: most-trained weight × reps exercises in range, e1RM per session.
  const perEx = new Map();
  for (const w of list) {
    for (const it of w.items) {
      const ex = exById(S, it.exerciseId);
      if (!ex || ex.tracking !== 'weight_reps') continue;
      const e1 = sessionStats(it.sets.filter((s) => s.done)).bestE1rm;
      if (e1 == null) continue;
      if (!perEx.has(ex.id)) perEx.set(ex.id, { ex, points: [] });
      const pts = perEx.get(ex.id).points;
      const same = pts.find((p) => p.x === w.startedAt);
      if (same) same.y = Math.max(same.y, e1);
      else pts.push({ x: w.startedAt, y: e1 });
    }
  }
  const lifts = [...perEx.values()]
    .filter((l) => l.points.length >= 2)
    .sort((a, b) => b.points.length - a.points.length || a.ex.name.localeCompare(b.ex.name))
    .slice(0, 4)
    .map((l) => {
      const first = l.points[0].y;
      const last = l.points[l.points.length - 1].y;
      const best = Math.max(...l.points.map((p) => p.y));
      return { ...l, first, last, best, changePct: first ? ((last - first) / first) * 100 : 0 };
    });

  // Recent personal records in range (newest first).
  const records = [];
  for (const w of list.slice().reverse()) {
    for (const r of workoutRecords(S, w.id)) {
      records.push({ ...r, at: w.startedAt, workoutId: w.id });
      if (records.length >= 12) break;
    }
    if (records.length >= 12) break;
  }

  return {
    range, weeks, totals, tagCounts, muscleSets, streak, lifts, records,
    perWeek: list.length / nWeeks,
    tags: allTags(S).filter((t) => tagCounts[t]).concat(tagCounts.Untagged ? ['Untagged'] : []),
  };
}

Object.assign(KS, { DEFAULT_TAGS, allTags, tagColor, inferTags, toggleTag, historyList, HISTORY_SORTS, REPORT_RANGES, reportData });

function parseRoute() {
  const h = (location.hash || '').replace(/^#\/?/, '');
  const [name = 'today', id = null, extra = null] = h.split('/').filter(Boolean);
  return { name: VIEWS[name] ? name : 'today', id: id ? decodeURIComponent(id) : null, extra };
}
function go(path, { replace = false } = {}) {
  const target = '#/' + path;
  if (replace) {
    history.replaceState(null, '', target);
    render();
  } else if (location.hash === target) {
    render();
  } else {
    location.hash = target;
  }
}
/** Back within the app, falling back to a tab when there is no history (fresh launch). */
function goBack(fallback = 'today') {
  if (history.length > 1 && ui.navDepth > 0) history.back();
  else go(fallback, { replace: true });
}

function tabsHtml(active) {

}

function render({ keepScroll = false } = {}) {
  if (!S) return;
  const r = parseRoute();
  const key = `${r.name}/${r.id || ''}/${r.extra || ''}`;
  const sameRoute = key === ui.lastKey;
  const y = window.scrollY;
  ui.route = r;
  let v;
  try {
    v = VIEWS[r.name](r);
  } catch (e) {
    console.error(e);
    v = { title: 'Something went wrong', body: `<div class="empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p></div>`, tab: 'today' };
  }
  if (v.redirect) {
    go(v.redirect, { replace: true });
    return;
  }
  const top = $('#top');
  top.className = v.large ? 'large' : '';
  top.innerHTML = `<div class="t-side left">${v.left || ''}</div><div class="t-title">${v.titleHtml || esc(v.title || '')}</div><div class="t-side right">${v.right || ''}</div>`;
  $('#view').innerHTML = v.body;
  $('#tabs').innerHTML = tabsHtml(v.tab);
  document.body.classList.toggle('no-tabs', !!v.noTabs);
  document.title = v.title && v.title !== APP.name ? `${v.title} · ${APP.short}` : APP.name;
  if (keepScroll && sameRoute) window.scrollTo(0, y);
  else if (!sameRoute) window.scrollTo(0, 0);
  ui.lastKey = key;
  if (v.mount) v.mount();

}

// ---------- event delegation ----------

});

// ---------- overlays ----------
const Layer = {
  stack: [],
  push(el, { onClose, dismissable = true } = {}) {
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    const wrap = document.createElement('div');
    wrap.appendChild(scrim);
    wrap.appendChild(el);
    if (dismissable) scrim.addEventListener('click', () => this.close());
    $('#layer').appendChild(wrap);
    this.stack.push({ wrap, onClose });
    document.body.style.overflow = 'hidden';
    return el;
  },
  close(result) {
    const top = this.stack.pop();
    if (!top) return;
    top.wrap.remove();
    if (!this.stack.length) document.body.style.overflow = '';
    if (top.onClose) top.onClose(result);
  },
  closeAll() {
    while (this.stack.length) this.close();
  },
};
A.closeLayer = () => Layer.close();

/** Bottom sheet. Returns the sheet element; `body` can be re-rendered via el.querySelector('.sheet-body'). */
function openSheet({ title, body, foot = '', full = false, left = '', right = '', onClose }) {
  const el = document.createElement('div');
  el.className = 'sheet' + (full ? ' full' : '');
  el.innerHTML = `<div class="sheet-head"><div style="min-width:64px">${left || `<button class="link" data-a="closeLayer">Close</button>`}</div><h2>${esc(title)}</h2><div style="min-width:64px;text-align:right">${right}</div></div>
    <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
  return Layer.push(el, { onClose });
}

/** Action sheet. options: [{label, fn, destructive}] */
function menu(title, options) {
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="menu">${title ? `<h3>${esc(title)}</h3>` : ''}${options
    .map((o, i) => `<button data-mi="${i}" class="${o.destructive ? 'destructive' : ''}">${esc(o.label)}</button>`)
    .join('')}<button class="cancel" data-mi="-1">Cancel</button></div>`;
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-mi]');
    if (!b) return;
    ev.stopPropagation();
    const i = Number(b.dataset.mi);
    Layer.close();
    if (i >= 0) options[i].fn();
  });
  Layer.push(el);
}

function dialog({ title, msg = '', ok = 'OK', cancel = 'Cancel', destructive = false, input = null }) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'dialog';
    el.setAttribute('role', 'dialog');
    el.innerHTML = `<div class="d-body"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}${
      input ? `<input class="field" id="dlg-in" value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}" autocomplete="off">` : ''
    }</div><div class="d-btns">${cancel ? `<button data-d="0">${esc(cancel)}</button>` : ''}<button data-d="1" class="${destructive ? 'destructive' : ''}">${esc(ok)}</button></div>`;
    let done = false;
    const finish = (v) => {
      if (done) return;
      done = true;
      Layer.close();
      resolve(v);
    };
    el.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-d]');
      if (!b) return;
      ev.stopPropagation();
      if (b.dataset.d === '1') finish(input ? $('#dlg-in', el).value : true);
      else finish(input ? null : false);
    });
    Layer.push(el, { onClose: () => { if (!done) { done = true; resolve(input ? null : false); } } });
    if (input) {
      const f = $('#dlg-in', el);
      f.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); finish(f.value); } });
      setTimeout(() => { f.focus(); f.select(); }, 50);
    }
  });
}
const confirmDlg = (title, msg, ok = 'OK', destructive = false) => dialog({ title, msg, ok, destructive });
const alertDlg = (title, msg) => dialog({ title, msg, ok: 'OK', cancel: null });
const promptDlg = (title, value = '', placeholder = '') => dialog({ title, ok: 'Save', input: { value, placeholder } });

// ---------- screen wake lock (keeps the phone awake during a workout) ----------
const Wake = {
  lock: null,
  want: false,
  async update() {
    const want = !!(S && S.settings.keepAwake && ui.route && ui.route.name === 'active' && activeWorkout(S) && !activeWorkout(S).backdated);
    this.want = want;
    if (!('wakeLock' in navigator)) return;
    try {
      if (want && !this.lock && document.visibilityState === 'visible') {
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => (this.lock = null));
      } else if (!want && this.lock) {
        await this.lock.release();
        this.lock = null;
      }
    } catch (e) {
      this.lock = null; // not allowed (low battery, unsupported) — harmless
    }
  },
};

  } else {
    Store.flush();
  }
});

// ---------- beep (Web Audio; iOS needs a tap first to allow sound) ----------
const Beep = {
  ctx: null,
  unlock() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      g.gain.value = 0;
      o.connect(g).connect(this.ctx.destination);
      o.start();
      o.stop(this.ctx.currentTime + 0.01);
    } catch (e) {
      this.ctx = null;
    }
  },
  play() {
    if (!this.ctx) return;
    try {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t0 = this.ctx.currentTime;
      [0, 0.22, 0.44].forEach((d, i) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
        o.connect(g).connect(this.ctx.destination);
        o.start(t0 + d);
        o.stop(t0 + d + 0.2);
      });
    } catch (e) { /* ignore */ }
  },
};
document.addEventListener('touchstart', () => Beep.unlock(), { passive: true, once: true });

/** Start a workout, guarding against two running at once. */
async function startFlow(make) {
  if (ui.pendingDraft && !activeWorkout(S)) {
    const ok = await confirmDlg('Unsaved workout found', `Starting a new workout discards the draft of “${ui.pendingDraft.workout.name}”. Restore it from Today instead?`, 'Discard & start', true);
    if (!ok) return;
    ui.pendingDraft = null;
    await Store.clearDraft();
  }
  const active = activeWorkout(S);
  const begin = () => {
    const id = make();
    if (!id) return;
    commit({ render: false });
    go('active');
  };
  if (!active) return begin();
  menu(`“${active.name}” is still in progress`, [
    { label: 'Resume it', fn: () => go('active') },
    {
      label: 'Discard it and start new',
      destructive: true,
      fn: () => {
        deleteWorkout(S, active.id);
        Rest.stop();
        begin();
      },
    },
  ]);
}
A.startEmpty = () => startFlow(() => startWorkout(S));

  const el = openSheet({ title, body });

/* ---- 05_workout.js ---- */
/* ==========================================================================
   05_workout — the active workout screen and the rest timer.
   Typing into a set field updates S immediately (no re-render, so the keyboard
   stays up); ticking ✓ re-renders. Everything is saved as it happens.
   ========================================================================== */
const REST_CHOICES = [30, 45, 60, 90, 120, 150, 180, 240, 300];

// ---------- rest timer (persisted in S.restTimer so it survives reloads) ----------
const Rest = {
  _iv: null,
  start(seconds, label) {
    if (!seconds || seconds <= 0) return;
    S.restTimer = { endsAt: Date.now() + seconds * 1000, total: seconds, label };
    Store.save();
    this.ensureTicking();
    this.paint();
  },
  adjust(delta) {
    const t = S.restTimer;
    if (!t) return;
    t.endsAt = Math.max(Date.now() + 1000, t.endsAt + delta * 1000);
    t.total = Math.max(1, t.total + delta);
    Store.save();
    this.paint();
  },
  stop() {
    if (!S.restTimer) return;
    S.restTimer = null;
    Store.save();
    this.paint();
  },
  ensureTicking() {
    if (this._iv) return;
    this._iv = setInterval(() => this.tick(), 250);
  },
  tick() {
    const t = S && S.restTimer;
    if (!t) {
      clearInterval(this._iv);
      this._iv = null;
      return;
    }
    if (Date.now() >= t.endsAt) {
      const lateBy = Date.now() - t.endsAt;
      S.restTimer = null;
      Store.save();
      this.paint();
      if (document.visibilityState === 'visible' && lateBy < 5000) {
        if (S.settings.restSound) Beep.play();
        const bar = $('#restbar');
        toast(`Rest over. Next: ${t.label}`, 3000);
        if (bar) { const tm = $('.time', bar); if (tm) tm.textContent = '0:00'; bar.classList.add('show', 'flash'); setTimeout(() => bar.classList.remove('show', 'flash'), 1600); }
      }
      return;
    }
    this.paint();
  },
  paint() {
    const bar = $('#restbar');
    if (!bar) return;
    const t = S && S.restTimer;
    const onWorkout = ui.route && ui.route.name === 'active';
    if (!t || !onWorkout) {
      if (!bar.classList.contains('flash')) bar.classList.remove('show');
      return;
    }
    const left = Math.max(0, Math.ceil((t.endsAt - Date.now()) / 1000));
    const pct = Math.min(100, (left / t.total) * 100);
    if (!bar.firstChild || !bar.dataset.built) {
      bar.innerHTML = `<div class="prog"></div><div class="row">
        <button class="adj" data-a="restAdj" data-d="-15">−15</button>
        <div class="grow" style="text-align:center"><div class="time"></div><div class="tiny dim ell rest-label"></div></div>
        <button class="adj" data-a="restAdj" data-d="15">+15</button>
        <button class="adj skip" data-a="restSkip">Skip</button></div>`;
      bar.dataset.built = '1';
    }
    bar.classList.add('show');
    $('.prog', bar).style.width = pct + '%';
    $('.time', bar).textContent = fmtClock(left);
    $('.rest-label', bar).textContent = `Rest · next: ${t.label}`;
  },
};
A.restAdj = (d) => Rest.adjust(Number(d.d));
A.restSkip = () => Rest.stop();

/** Name of what comes after completing a set of item `idx` (superset-aware). */
function nextUpLabel(w, idx) {
  const info = supersetInfo(w.items.map((i) => i.superset));
  const hasUndone = (i) => w.items[i] && w.items[i].sets.some((s) => !s.done);
  const name = (i) => exById(S, w.items[i].exerciseId)?.name || 'Next exercise';
  if (info[idx] && info[idx].label) {
    let first = idx, last = idx;
    while (first > 0 && !info[first].isFirst) first--;
    while (last < w.items.length - 1 && !info[last].isLast) last++;
    for (let i = first; i <= last; i++) if (hasUndone(i)) return name(i);
    for (let i = last + 1; i < w.items.length; i++) if (hasUndone(i)) return name(i);
    return null;
  }
  if (hasUndone(idx)) return name(idx);
  for (let i = idx + 1; i < w.items.length; i++) if (hasUndone(i)) return name(i);
  return null;
}

// ---------- handlers ----------
function activeCtx(setId) {
  const w = curW();
  if (!w) return null;
  const f = findSet(w, setId);
  return f ? { w, ...f, ex: exById(S, f.item.exerciseId) } : null;
}
I.setField = (d, el) => {
  const c = activeCtx(d.s);
  if (!c) return;
  const field = fieldsFor(c.ex.tracking).find((f) => f.key === d.f);
  const v = field.parse(el.value, unit());
  if (v === undefined) return; // half-typed / invalid: keep the stored value
  c.set[d.f] = v;
  Store.save();
};
BL.setFieldBlur = (d, el) => {
  const c = activeCtx(d.s);
  if (!c) return;
  const field = fieldsFor(c.ex.tracking).find((f) => f.key === d.f);
  el.value = field.format(c.set[d.f], unit());
};
A.tick = async (d) => {
  const c = activeCtx(d.s);
  if (!c) return;
  if (c.set.done) {
    c.set.done = false;
    c.set.doneAt = null;
    commit();
    return;
  }
  // A field may still hold text the input handler rejected mid-typing; read it now.
  const row = document.querySelector(`[data-row="${c.set.id}"]`);
  if (row) for (const inp of $$('input[data-f]', row)) I.setField(inp.dataset, inp);
  const res = completeSet(S, c.w, c.item, c.set);
  if (!res.ok) {
    alertDlg('Nothing to log yet', res.tracking === 'cardio' ? 'Enter a duration or distance first.' : res.tracking === 'time' ? 'Enter a time in seconds first (e.g. 60).' : 'Enter reps first.');
    return;
  }
  if (navigator.vibrate) navigator.vibrate(15);
  const idx = c.w.items.indexOf(c.item);
  if (c.ex.tracking !== 'cardio' && !c.w.backdated && !isEditing()) {
    const label = nextUpLabel(c.w, idx);
    if (!label) Rest.stop();
    else if (shouldRestAfter(c.w.items.map((i) => i.superset), idx)) Rest.start(c.item.restS ?? S.settings.defaultRestS, label);
    else if (S.settings.supersetRestS > 0) Rest.start(S.settings.supersetRestS, label);
    else Rest.stop();
  }
  commit();
};
A.addSet = (d) => {

    { label: 'Warm-up', fn: kind('warmup') },
    { label: 'Working set', fn: kind('working') },
    { label: 'Drop set', fn: kind('drop') },
    { label: 'To failure', fn: kind('failure') },
    { label: 'Delete set', destructive: true, fn: () => { c.item.sets = c.item.sets.filter((s) => s !== c.set); commit(); } },
  ]);
};
A.exMenu = (d) => {
  const w = curW();
  const idx = w ? w.items.findIndex((i) => i.id === d.it) : -1;
  if (idx < 0) return;
  const item = w.items[idx];
  const ex = exById(S, item.exerciseId);
  const info = supersetInfo(w.items.map((i) => i.superset))[idx];
  const opts = [
    { label: item.notes != null ? 'Remove note' : 'Add note', fn: () => { item.notes = item.notes != null ? null : ''; commit(); } },
  ];
  if (ex.tracking !== 'cardio') {
    opts.push({ label: `Rest time (${fmtClock(item.restS ?? S.settings.defaultRestS)})`, fn: () => restMenu((v) => { item.restS = v; commit(); }) });
  }
  if (idx < w.items.length - 1) {

  }
  if (idx > 0) opts.push({ label: 'Move up', fn: () => { moveItem(w.items, item.id, -1); commit(); } });
  if (idx < w.items.length - 1) opts.push({ label: 'Move down', fn: () => { moveItem(w.items, item.id, 1); commit(); } });
  opts.push({ label: 'Exercise history', fn: () => go('exercise/' + item.exerciseId) });
  opts.push({
    label: 'Remove exercise',
    destructive: true,
    fn: async () => {

    onSave: (ts, dur) => {
      setWorkoutDate(w, ts, dur);
      if (!w.backdated) delete w.plannedDurationS;
      if (w.backdated) Rest.stop();
      commit();
      toast(w.backdated ? `Logged as ${fmtDay(w.startedAt)}` : 'Date updated');
    },
  });
};

// ---------- editing a saved workout ----------
A.editWorkout = (d) => {
  const cur = editingWorkout(S);
  if (cur && cur.id !== d.id && editChanged(S)) {
    menu(`Unsaved edits to “${cur.name}”`, [
      { label: 'Continue those edits', fn: () => go('edit/' + cur.id) },
      { label: 'Discard them and edit this one', destructive: true, fn: () => { cancelEdit(S); Store.save(); go('edit/' + d.id); } },
    ]);
    return;
  }
  if (cur && cur.id !== d.id) cancelEdit(S);
  go('edit/' + d.id);
};
A.editSave = async () => {
  const w = editingWorkout(S);
  if (!w) return go('history');
  const undone = editUndone(S);
  if (undone && !(await confirmDlg('Save changes?', `${plural(undone, 'unticked set')} will be removed.`, 'Save'))) return;
  const r = saveEdit(S);
  if (r.empty) {
    if (await confirmDlg('No sets left', 'Tick at least one set, or delete the whole workout.', 'Delete workout', true)) {
      cancelEdit(S);
      deleteWorkout(S, w.id);
      Store.permitShrink();
      await Store.flush();
      toast('Workout deleted');
      go('history', { replace: true });
    }
    return;
  }
  await Store.flush();
  toast('Changes saved');
  go('workout/' + w.id, { replace: true });
};
A.editCancel = async () => {
  const w = editingWorkout(S);
  if (w && editChanged(S) && !(await confirmDlg('Discard changes?', 'The saved workout stays as it was.', 'Discard', true))) return;
  cancelEdit(S);
  Store.save();
  go(w ? 'workout/' + w.id : 'history', { replace: true });
};

// ---------- editor ----------
function tField(label, inner, width) {
  return `<div style="${width ? `width:${width}px;flex:0 0 ${width}px` : 'flex:1;min-width:0'}"><div class="flabel">${esc(label)}</div>${inner}</div>`;
}
function tInput(t, item, key, value, placeholder, mode = 'decimal') {
  return `<input class="num" inputmode="${mode}" enterkeyhint="done" autocomplete="off" data-i="tField" data-b="tFieldBlur" data-t="${t.id}" data-it="${item.id}" data-k="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}">`;
}
/** Parse + format for each editable template field. */
const T_FIELDS = {
  repMin: { parse: (s) => (s.trim() ? parseCount(s) ?? undefined : null), fmt: (v) => (v == null ? '' : String(v)) },
  repMax: { parse: (s) => (s.trim() ? parseCount(s) ?? undefined : null), fmt: (v) => (v == null ? '' : String(v)) },
  weightKg: {
    parse: (s) => { if (!s.trim()) return null; const n = parseNumber(s); return n == null || n < 0 ? undefined : fromDisplayWeight(n, unit()); },
    fmt: (v) => fmtWeight(v, unit()),
  },
  durationS: { parse: (s) => (s.trim() ? parseDuration(s, 'sec') ?? undefined : null), fmt: (v) => (v == null ? '' : fmtClock(v)) },
  durationMin: { key: 'durationS', parse: (s) => (s.trim() ? parseDuration(s, 'min') ?? undefined : null), fmt: (v) => (v == null ? '' : String(Math.round(v / 60))) },
  distanceM: { parse: (s) => { if (!s.trim()) return null; const n = parseNumber(s); return n == null || n < 0 ? undefined : n * 1000; }, fmt: (v) => fmtKm(v) },
};

VIEWS.template = (r) => {
  const t = templateById(S, r.id);
  if (!t) return { redirect: 'templates' };
  const u = unit();
  const info = supersetInfo(t.items.map((i) => i.superset));
  let html = `<input class="title-input" data-i="tName" data-b="tNameBlur" data-t="${t.id}" value="${esc(t.name)}" placeholder="Template name" autocomplete="off" enterkeyhint="done">
    <textarea class="field" style="background:transparent;padding:4px 0;min-height:28px" rows="1" data-i="tNotes" data-t="${t.id}" placeholder="Notes (optional)">${esc(t.notes || '')}</textarea>
    <div class="caps mt12" style="margin-bottom:4px">Tags</div>${tagEditor('template', t)}
    <div class="mt16">`;
  t.items.forEach((item, idx) => {
    const ex = exById(S, item.exerciseId) || { name: 'Unknown exercise', tracking: 'weight_reps' };
    const ss = info[idx];
    const cls = ['card', ss.label ? 'ex ss' : '', ss.label && !ss.isLast ? 'linked-below' : '', ss.label && !ss.isFirst ? 'linked-above' : ''].join(' ');
    let fields = '';
    if (ex.tracking === 'cardio') {
      fields = tField('MIN', tInput(t, item, 'durationMin', T_FIELDS.durationMin.fmt(item.durationS), '–')) + tField('KM', tInput(t, item, 'distanceM', fmtKm(item.distanceM), '–'));
    } else {
      fields = tField('SETS', `<div class="stepper"><button data-a="tSets" data-t="${t.id}" data-it="${item.id}" data-d="-1" aria-label="Fewer sets">−</button><span class="bold tnum">${item.sets}</span><button data-a="tSets" data-t="${t.id}" data-it="${item.id}" data-d="1" aria-label="More sets">+</button></div>`, 104);
      if (ex.tracking === 'time') {
        fields += tField('TIME (S)', tInput(t, item, 'durationS', T_FIELDS.durationS.fmt(item.durationS), '60'));
      } else {
        fields += tField('REPS', `<div class="row" style="gap:4px">${tInput(t, item, 'repMin', T_FIELDS.repMin.fmt(item.repMin), '8', 'numeric')}<span class="faint">–</span>${tInput(t, item, 'repMax', T_FIELDS.repMax.fmt(item.repMax), '12', 'numeric')}</div>`);
        fields += tField(ex.tracking === 'bodyweight_reps' ? '+' + u.toUpperCase() : u.toUpperCase(), tInput(t, item, 'weightKg', fmtWeight(item.weightKg, u), 'auto'), 64);
      }
    }
    html += `<div class="${cls}" style="margin-bottom:${ss.label && !ss.isLast ? 2 : 12}px;padding:12px;${ssStyle(ss)}">
      <div class="row">${ssBadge(ss)}<div class="grow bold ell ${ex.tracking === 'cardio' ? 'cardio' : ''}" style="font-size:17px">${esc(ex.name)}</div>
      <button class="icon-btn" data-a="tItemMenu" data-t="${t.id}" data-it="${item.id}" aria-label="Exercise options">${icon('more')}</button></div>
      <div class="row mt8" style="align-items:flex-end">${fields}</div>
      ${ex.tracking !== 'cardio' ? `<button class="small dim mt8" data-a="tRest" data-t="${t.id}" data-it="${item.id}">Rest ${fmtClock(item.restS ?? S.settings.defaultRestS)}${item.restS == null ? ' (default)' : ''} ›</button>` : ''}</div>`;
  });
  html += `</div>`;
  html += t.items.length
    ? `<p class="tiny faint" style="margin:0 0 12px">Sets pre-fill with what you lifted last time. The template weight is only used until you have history.</p>`
    : `<p class="dim" style="text-align:center;margin:16px 0">Add exercises. Select two or more and tap “Add as superset” to pair them.</p>`;
  html += `<button class="btn" data-a="pickFor" data-mode="template" data-id="${t.id}">${icon('plus')} Add exercises</button>`;
  if (t.items.length) html += `<button class="btn primary mt12" data-a="startTemplate" data-id="${t.id}">${icon('play')} Start workout</button>`;
  return {
    title: t.name,
    titleHtml: '&nbsp;',
    left: backBtn('templates'),
    right: `<button class="icon-btn" data-a="tMenu" data-t="${t.id}" aria-label="Template options" style="color:var(--accent)">${icon('more')}</button>`,
    body: html,
    tab: 'templates',
    mount() {
      if (ui.focusTemplateName === t.id) {
        ui.focusTemplateName = null;
        const f = $('.title-input');
        if (f) { f.focus(); f.select(); }
      }
    },
  };
};

const tItem = (d) => {
  const t = templateById(S, d.t);
  const item = t && t.items.find((i) => i.id === d.it);
  return item ? { t, item } : null;
};
const touchT = (t) => (t.updatedAt = Date.now());
I.tName = (d, el) => { const t = templateById(S, d.t); if (t) { t.name = el.value; touchT(t); Store.save(); } };
BL.tNameBlur = (d, el) => { const t = templateById(S, d.t); if (t && !t.name.trim()) { t.name = 'Untitled'; el.value = t.name; Store.save(); } };
I.tNotes = (d, el) => { const t = templateById(S, d.t); if (t) { t.notes = el.value || null; Store.save(); } };
I.tField = (d, el) => {
  const c = tItem(d);
  if (!c) return;
  const f = T_FIELDS[d.k];
  const v = f.parse(el.value);
  if (v === undefined) return;
  c.item[f.key || d.k] = v;
  touchT(c.t);
  Store.save();
};
BL.tFieldBlur = (d, el) => {
  const c = tItem(d);
  if (!c) return;
  const f = T_FIELDS[d.k];
  el.value = f.fmt(c.item[f.key || d.k]);
};
A.tSets = (d) => {
  const c = tItem(d);
  if (!c) return;
  c.item.sets = Math.min(20, Math.max(1, c.item.sets + Number(d.d)));
  touchT(c.t);
  commit();
};
A.tRest = (d) => {
  const c = tItem(d);
  if (c) restMenu((v) => { c.item.restS = v; touchT(c.t); commit(); });
};
A.tItemMenu = (d) => {
  const c = tItem(d);
  if (!c) return;
  const { t, item } = c;
  const idx = t.items.indexOf(item);
  const info = supersetInfo(t.items.map((i) => i.superset))[idx];
  const ex = exById(S, item.exerciseId);
  const opts = [];
  if (idx < t.items.length - 1) opts.push({ label: info.label && !info.isLast ? 'Unlink superset from next' : 'Superset with next exercise', fn: () => { toggleSupersetItem(t.items, item.id); touchT(t); commit(); } });
  if (idx > 0) opts.push({ label: 'Move up', fn: () => { moveItem(t.items, item.id, -1); touchT(t); commit(); } });
  if (idx < t.items.length - 1) opts.push({ label: 'Move down', fn: () => { moveItem(t.items, item.id, 1); touchT(t); commit(); } });
  opts.push({ label: 'Remove', destructive: true, fn: () => { removeItem(t.items, item.id); touchT(t); commit(); } });
  menu(ex ? ex.name : 'Exercise', opts);
};
A.tMenu = (d) => {
  const t = templateById(S, d.t);
  if (t) templateMenu(t, true);
};

const hist = { tag: 'All', sort: 'new' };
VIEWS.history = () => {
  const u = unit();
  const all = finishedWorkouts(S);
  if (!all.length) return { title: 'History', large: true, body: emptyBox('history', 'No workouts yet', 'Finished workouts show up here.'), tab: 'history' };
  const tags = allTags(S).filter((t) => all.some((w) => (w.tags || []).includes(t)));
  if (all.some((w) => !(w.tags || []).length)) tags.push('Untagged');
  if (hist.tag !== 'All' && !tags.includes(hist.tag)) hist.tag = 'All';
  const list = historyList(S, hist);
  const sortLabel = HISTORY_SORTS.find((x) => x.id === hist.sort).label;
  let html = `<div class="chips">${['All', ...tags]
    .map((t) => `<button class="chip ${hist.tag === t ? 'on' : ''}" data-a="histTag" data-tag="${esc(t)}">${t !== 'All' ? `<span class="sw" style="background:${tagColor(S, t)}"></span>` : ''}${esc(t)}</button>`)
    .join('')}</div>
    <div class="row between small dim" style="margin:2px 0 4px"><span>${plural(list.length, 'workout')}</span>
    <button class="link small" data-a="histSort">${icon('down')} ${esc(sortLabel)}</button></div>`;
  const card = (w) => {
    const st = workoutStats(S, w);
    const names = w.items.map((i) => exById(S, i.exerciseId)?.name).filter(Boolean).join(', ');
    return `<div class="card tap" data-a="go" data-to="workout/${w.id}">
      <div class="row between"><div class="bold ell grow" style="font-size:17px">${esc(w.name)}</div><div class="small dim">${esc(fmtDate(w.startedAt))} · ${fmtTime(w.startedAt)}</div></div>
      ${(w.tags || []).length ? `<div class="row wrap mt4" style="gap:6px">${w.tags.map(tagPill).join('')}</div>` : ''}
      <div class="small dim mt4" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(names)}</div>
      <div class="row mt8" style="gap:16px;font-size:14px;font-weight:600"><span>${fmtDurShort(st.durationS)}</span><span class="dim">${plural(st.sets, 'set')}</span>
      ${st.volumeKg > 0 ? `<span class="dim tnum">${fmtInt(toDisplayWeight(st.volumeKg, u))} ${u}</span>` : ''}
      ${st.cardioS > 0 ? `<span class="cardio">${fmtDurShort(st.cardioS)} cardio</span>` : ''}</div></div>`;
  };
  if (!list.length) {
    html += `<p class="dim" style="text-align:center;margin-top:32px">No workouts with this tag.</p>`;
  } else if (hist.sort === 'new' || hist.sort === 'old') {
    // Grouped by month when sorted by date.
    let month = '';
    let group = [];
    const flush = () => {
      if (group.length) html += `<div class="caps" style="margin:16px 0 8px">${esc(month)} · ${group.length}</div><div class="stack">${group.join('')}</div>`;
      group = [];
    };
    for (const w of list) {
      const m = fmtMonth(w.startedAt);
      if (m !== month) { flush(); month = m; }
      group.push(card(w));
    }
    flush();
  } else {
    html += `<div class="stack mt8">${list.map(card).join('')}</div>`;
  }
  return { title: 'History', large: true, body: html, tab: 'history' };
};
A.histTag = (d) => { hist.tag = d.tag; rerender(); };
A.histSort = () => menu('Sort workouts', HISTORY_SORTS.map((x) => ({ label: (x.id === hist.sort ? '✓ ' : '') + x.label, fn: () => { hist.sort = x.id; rerender(); } })));

function fmtRecord(type, value, u) {
  switch (type) {
    case 'e1rm': return `${Math.round(toDisplayWeight(value, u) * 10) / 10} ${u}`;
    case 'weight': return `${fmtWeight(value, u)} ${u}`;
    case 'volume': return `${fmtInt(toDisplayWeight(value, u))} ${u}`;
    case 'reps': return `${value} reps`;
    case 'distance': return `${fmtKm(value)} km`;
    case 'duration': return fmtClock(value);
    case 'pace': return `${fmtClock(value)} /km`;
  }
  return String(value);
}

VIEWS.workout = (r) => {
  const w = workoutById(S, r.id);
  if (!w) return { redirect: 'history' };
  if (!w.finishedAt) return { redirect: 'active' };
  const summary = r.extra === 'summary';
  const u = unit();
  const st = workoutStats(S, w);

  let html = summary ? `<div class="caps accent" style="color:var(--accent)">Workout complete</div>` : '';
  const ed = editingWorkout(S);

      <div class="draft-bar"><button class="btn sm primary" data-a="go" data-to="edit/${w.id}">Continue editing</button><button class="btn sm" data-a="editCancel">Discard</button></div></div>`;
  }
  html += `<h1 style="font-size:28px;letter-spacing:-.02em">${esc(w.name)}</h1><div class="dim">${esc(fmtDate(w.startedAt))} · ${fmtTime(w.startedAt)}</div>
    <div class="mt12">${tagEditor('workout', w)}</div>
    <div class="card mt16"><div class="stats">${stat('duration', fmtDurShort(st.durationS))}${stat('sets', String(st.sets))}${
      st.volumeKg > 0 ? stat(`${u} lifted`, fmtInt(toDisplayWeight(st.volumeKg, u))) : ''}${st.cardioS > 0 ? stat('cardio', fmtDurShort(st.cardioS)) : ''}</div></div>`;
  if (recs.length) {
    html += `<div class="card accent-border mt12"><div class="row accent bold" style="color:var(--accent)">${icon('trophy')} ${plural(recs.length, 'personal record')}</div>
      <div class="mt8 stack" style="font-size:15px">${recs
        .map((x) => `<div class="row between"><div class="ell grow">${esc(x.exerciseName)} <span class="dim">· ${esc(RECORD_LABELS[x.type])}</span></div><div class="bold tnum">${esc(fmtRecord(x.type, x.value, u))}</div></div>`)
        .join('')}</div></div>`;

    html += `<div class="card tap ${ss.label ? 'ex ss' : ''}" style="padding:14px 16px;margin:0;${ssStyle(ss)}" data-a="go" data-to="exercise/${ex.id}">

        .map((s) => {

/* ---- 07b_progress.js ---- */
/* ==========================================================================
   07b_progress — the Progress tab (reporting panel).
   Charts are plain SVG/HTML: thin marks, rounded bar ends on the baseline,
   2px gaps between stacked segments, recessive grid, legend + direct labels,
   tap a bar for its numbers, and a table view for the weekly chart.
   Tag colours follow the tag (fixed order), never its rank.
   ========================================================================== */
const prog = { range: '12w', table: false };
const TIPS = {}; // chartId -> [text per bar]

function barChart(id, weeks, { series, value, color, fmt = (v) => String(v), label }) {
  const W = 340, H = 150, pl = 4, pr = 30, pt = 10, pb = 20;
  const n = weeks.length;
  const w = W - pl - pr, h = H - pt - pb;
  const slot = w / n;
  const bw = Math.max(2, Math.min(18, slot - Math.max(1, slot * 0.28)));
  const totals = weeks.map((wk) => (series ? series.reduce((a, s) => a + (wk.byTag[s] || 0), 0) : value(wk)));
  const max = Math.max(1, ...totals);
  const niceMax = series ? Math.max(1, Math.ceil(max)) : max;
  const y = (v) => (v / niceMax) * h;
  let bars = '';
  const tips = [];
  weeks.forEach((wk, i) => {
    const x = pl + i * slot + (slot - bw) / 2;
    let base = pt + h;
    const parts = [];
    if (series) {
      const segs = series.filter((s) => wk.byTag[s]);
      segs.forEach((s, k) => {
        const v = wk.byTag[s];
        const hh = y(v);
        const top = k === segs.length - 1;
        const gap = k > 0 ? 2 : 0; // 2px surface gap between stacked segments
        const yy = base - hh + gap;
        const r = top ? Math.min(4, bw / 2) : 0;
        bars += top
          ? `<path d="M${x},${base} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${base} Z" fill="${tagColor(S, s)}"/>`
          : `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0, hh - gap)}" fill="${tagColor(S, s)}"/>`;
        base -= hh;
        parts.push(`${s} ${v}`);
      });
      tips.push(`Week of ${fmtShortDate(wk.start)}: ${plural(totals[i], 'workout')}${parts.length ? ' · ' + parts.join(', ') : ''}`);
    } else {
      const v = totals[i];
      if (v > 0) {
        const hh = Math.max(2, y(v));
        const yy = base - hh;
        const r = Math.min(4, bw / 2, hh);
        bars += `<path d="M${x},${base} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${base} Z" fill="${color}"/>`;
      }
      tips.push(`Week of ${fmtShortDate(wk.start)}: ${fmt(v)}${label ? ' ' + label : ''}`);
    }
    // Generous hit target (the full column), bigger than the mark.
    bars += `<rect x="${pl + i * slot}" y="${pt}" width="${slot}" height="${h + pb}" fill="transparent" data-a="barTip" data-chart="${id}" data-i="${i}"/>`;
  });
  TIPS[id] = tips;
  const first = weeks[0], last = weeks[n - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label || 'chart')} per week">
    <line x1="${pl}" x2="${pl + w}" y1="${pt}" y2="${pt}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <line x1="${pl}" x2="${pl + w}" y1="${pt + h}" y2="${pt + h}" stroke="var(--border)"/>
    <text x="${W - 2}" y="${pt + 4}" fill="var(--faint)" font-size="11" text-anchor="end">${esc(fmt(niceMax))}</text>
    <text x="${W - 2}" y="${pt + h + 4}" fill="var(--faint)" font-size="11" text-anchor="end">0</text>
    ${bars}
    <text x="${pl}" y="${H - 4}" fill="var(--faint)" font-size="11">${esc(fmtShortDate(first.start))}</text>
    <text x="${pl + w}" y="${H - 4}" fill="var(--faint)" font-size="11" text-anchor="end">${n > 1 ? 'this week' : ''}</text></svg>
    <div class="small dim tip" id="tip-${id}" aria-live="polite">Tap a bar for details.</div>`;
}
A.barTip = (d) => {
  const el = $('#tip-' + d.chart);
  if (el && TIPS[d.chart]) el.textContent = TIPS[d.chart][Number(d.i)];
};

function legend(tags) {
  return `<div class="row wrap mt8" style="gap:12px">${tags
    .map((t) => `<span class="row small" style="gap:6px"><span class="sw" style="background:${tagColor(S, t)}"></span>${esc(t)}</span>`)
    .join('')}</div>`;
}
/** Horizontal bars with the value as text (labels in text ink, never series colour). */
function hBars(rows, { colorOf = () => 'var(--accent)', fmt = String } = {}) {
  const max = Math.max(1, ...rows.map((r) => r.value));
  return `<div class="hbars">${rows
    .map((r) => `<div class="hb-row"><div class="hb-label ell">${esc(r.label)}</div>
      <div class="hb-track"><div class="hb-bar" style="width:${Math.max(2, (r.value / max) * 100)}%;background:${colorOf(r.label)}"></div></div>
      <div class="hb-val tnum">${esc(fmt(r.value))}</div></div>`)
    .join('')}</div>`;
}

VIEWS.progress = () => {
  const u = unit();
  const R = reportData(S, prog.range);
  const t = R.totals;
  let html = `<div class="chips">${REPORT_RANGES.map((r) => `<button class="chip ${r.id === prog.range ? 'on' : ''}" data-a="progRange" data-r="${r.id}">${esc(r.label)}</button>`).join('')}</div>`;

  if (!t.workouts) {
    html += emptyBox('progress', 'Nothing to report yet', `No finished workouts in the last ${R.range.label.toLowerCase()}. Finish a workout and your progress shows up here.`);
    return { title: 'Progress', large: true, body: html, tab: 'progress' };
  }

  // Headline tiles
  html += `<div class="tiles mt8">
    <div class="tile"><div class="tile-v">${t.workouts}</div><div class="tile-l">workouts</div></div>
    <div class="tile"><div class="tile-v">${Math.round(R.perWeek * 10) / 10}</div><div class="tile-l">per week</div></div>

    <div class="tile"><div class="tile-v">${fmtDurShort(t.cardioS)}</div><div class="tile-l">cardio${t.cardioM ? ` · ${t.cardioM >= 10000 ? Math.round(t.cardioM / 1000) : fmtKm(t.cardioM)} km` : ''}</div></div></div>`;

  // Workouts per week, stacked by split
  const series = R.tags;
  html += `<div class="card mt12"><div class="row between"><div class="caps">Workouts per week</div>
    <button class="link small" data-a="progTable">${prog.table ? 'Chart' : 'Table'}</button></div>`;
  if (prog.table) {
    html += `<table class="rtable mt8"><thead><tr><th>Week</th>${series.map((s) => `<th>${esc(s)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${R.weeks
      .slice()
      .reverse()
      .map((wk) => `<tr><td>${esc(fmtShortDate(wk.start))}</td>${series.map((s) => `<td>${wk.byTag[s] || ''}</td>`).join('')}<td class="bold">${wk.count || ''}</td></tr>`)
      .join('')}</tbody></table>`;
  } else {
    html += `<div class="mt8">${barChart('perweek', R.weeks, { series })}</div>${legend(series)}`;
  }
  html += `</div>`;

  // Split balance
  html += `<div class="card mt12"><div class="caps">Split balance</div><div class="small dim mt4">Workouts per tag in this period (a Push + Cardio day counts for both).</div>
    <div class="mt8">${hBars(series.map((s) => ({ label: s, value: R.tagCounts[s] || 0 })), { colorOf: (l) => tagColor(S, l) })}</div></div>`;

  // Key lifts
  if (R.lifts.length) {
    html += `<div class="section"><span class="caps">Key lifts · est. 1RM</span></div><div class="stack">${R.lifts
      .map((l) => {
        const ch = Math.round(l.changePct * 10) / 10;
        const arrow = ch > 0 ? '▲' : ch < 0 ? '▼' : '•';
        return `<div class="card tap" data-a="go" data-to="exercise/${l.ex.id}" style="padding:12px 14px">
          <div class="row between"><div class="bold ell grow">${esc(l.ex.name)}</div>
          <div class="tnum bold">${Math.round(toDisplayWeight(l.last, u) * 10) / 10} ${u}</div></div>
          <div class="row between small dim"><span>${plural(l.points.length, 'session')} · best ${Math.round(toDisplayWeight(l.best, u) * 10) / 10}</span>
          <span class="tnum">${arrow} ${ch > 0 ? '+' : ''}${ch}%</span></div>
          ${lineChart(l.points, { format: (v) => String(Math.round(toDisplayWeight(v, u))), height: 70 })}</div>`;
      })
      .join('')}</div>`;
  }

  // Weekly volume
  if (t.volumeKg > 0) {
    html += `<div class="card mt12"><div class="caps">Volume per week (${u})</div><div class="mt8">${barChart('volume', R.weeks, {
      value: (wk) => toDisplayWeight(wk.volumeKg, u), color: 'var(--accent)', fmt: (v) => fmtInt(v), label: u,
    })}</div></div>`;
  }

  // Sets per muscle group
  const muscles = Object.entries(R.muscleSets).sort((a, b) => b[1] - a[1]);
  if (muscles.length) {
    html += `<div class="card mt12"><div class="caps">Working sets per muscle</div><div class="small dim mt4">Warm-ups not counted. ${esc(R.range.label)}.</div>
      <div class="mt8">${hBars(muscles.map(([m, v]) => ({ label: m, value: v })), { colorOf: () => 'var(--accent)' })}</div></div>`;
  }

  // Cardio
  if (t.cardioS > 0) {
    html += `<div class="card mt12"><div class="caps">Cardio minutes per week</div><div class="mt8">${barChart('cardio', R.weeks, {
      value: (wk) => Math.round(wk.cardioS / 60), color: 'var(--t-cardio)', label: 'min',
    })}</div></div>`;
  }

  // Records
  if (R.records.length) {
    html += `<div class="section"><span class="caps">Recent personal records</span></div><div class="card" style="padding:4px 16px">${R.records
      .map((r) => `<button class="list-item" style="width:100%;text-align:left" data-a="go" data-to="workout/${r.workoutId}">
        <span style="color:var(--accent)">${icon('trophy')}</span><div class="grow"><div class="ell">${esc(r.exerciseName)}</div>
        <div class="small dim">${esc(RECORD_LABELS[r.type])} · ${esc(fmtShortDate(r.at))}</div></div><div class="bold tnum">${esc(fmtRecord(r.type, r.value, u))}</div></button>`)
      .join('')}</div>`;
  }
  return { title: 'Progress', large: true, body: html, tab: 'progress' };
};
