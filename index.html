<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knur Simulator</title>
<meta name="description" content="Gym planner and workout log. Offline, on your phone.">
<meta name="theme-color" content="#0B0B0C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knur">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #0B0B0C; --surface: #141416; --surface2: #1C1C1F; --surface3: #26262A; --border: #2A2A2E;
  --text: #F2F2F3; --dim: #9A9AA2; --faint: #5E5E66;
  --accent: #CFFF4A; --accent-dim: rgba(207,255,74,.12); --on-accent: #0B0B0C;
  --danger: #FF5A5F; --danger-dim: rgba(255,90,95,.12); --cardio: #5AC8FA; --warm: #FF9F0A;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --tabs-h: 56px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { min-height: 100vh; overscroll-behavior-y: none; font-size: 16px; line-height: 1.35; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
/* 16px+ on inputs stops iOS zooming in on focus */
input, textarea, select { font-size: 17px; }
h1, h2, h3, p { margin: 0; }
a { color: var(--accent); }
svg { width: 20px; height: 20px; flex: none; }
svg.chart { width: 100%; height: auto; display: block; }
.hidden { display: none !important; }
.tnum { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); } .faint { color: var(--faint); } .accent { color: var(--accent); } .cardio { color: var(--cardio); } .danger { color: var(--danger); }
.small { font-size: 13px; } .tiny { font-size: 11px; } .bold { font-weight: 700; }
.caps { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; font-weight: 600; color: var(--dim); }
.row { display: flex; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; } .grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }

/* ---------- layout ---------- */
#top { position: sticky; top: 0; z-index: 20; background: rgba(11,11,12,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: calc(var(--sat) + 6px) 12px 6px; min-height: calc(var(--sat) + 50px); display: flex; align-items: center; gap: 8px; }
#top .t-title { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 17px; }
#top .t-side { min-width: 72px; display: flex; align-items: center; }
#top .t-side.right { justify-content: flex-end; }
#top.large .t-title { text-align: left; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
#top.large .t-side.left { display: none; }
#view { padding: 4px 16px calc(var(--tabs-h) + var(--sab) + 32px); max-width: 640px; margin: 0 auto; }
body.no-tabs #view { padding-bottom: calc(var(--sab) + 120px); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: rgba(11,11,12,.95);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding-bottom: var(--sab); }
body.no-tabs #tabs { display: none; }
#tabs a { flex: 1; height: var(--tabs-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--faint); text-decoration: none; font-size: 11px; font-weight: 600; }
#tabs a.on { color: var(--accent); }
#tabs svg { width: 24px; height: 24px; }

/* ---------- controls ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: var(--r-md);
  font-weight: 700; font-size: 16px; background: var(--surface2); color: var(--text); width: 100%; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--danger-dim); color: var(--danger); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { min-height: 36px; padding: 0 14px; border-radius: var(--r-sm); font-size: 15px; width: auto; }
.btn:active { opacity: .7; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 19px; color: var(--dim); }
.icon-btn:active { background: var(--surface2); }
.icon-btn svg { width: 22px; height: 22px; }
.link { color: var(--accent); font-weight: 600; font-size: 15px; }
.back { color: var(--accent); display: inline-flex; align-items: center; font-size: 17px; margin-left: -6px; }
.back svg { width: 26px; height: 26px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; }
.card.tap:active { background: var(--surface2); }
.card.accent-border { border-color: var(--accent); }
.stack > * + * { margin-top: 8px; }
.section { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px; }
.chip { display: inline-flex; align-items: center; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--dim); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.pill { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--surface3); color: var(--dim); font-size: 11px; font-weight: 700; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 12px; font-weight: 800; color: var(--on-accent); }
.stats { display: flex; gap: 8px; } .stats > div { flex: 1; min-width: 0; }
.stat-v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; } .stat-l { font-size: 12px; color: var(--dim); }
.field { width: 100%; height: 50px; padding: 0 14px; border-radius: var(--r-md); border: 0; background: var(--surface2); outline: none; }
.field:focus { box-shadow: 0 0 0 2px var(--accent); }
textarea.field { height: auto; min-height: 44px; padding: 10px 12px; resize: none; font-size: 16px; line-height: 1.35; }
.title-input { width: 100%; background: transparent; border: 0; outline: none; font-size: 28px; font-weight: 800; letter-spacing: -.02em; padding: 4px 0; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: var(--r-sm); background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--dim); }
.avatar.cardio { background: rgba(90,200,250,.12); color: var(--cardio); }
.avatar svg { width: 18px; height: 18px; }
.empty { text-align: center; padding: 56px 24px; color: var(--dim); }
.empty svg { width: 40px; height: 40px; color: var(--faint); }
.empty h3 { color: var(--text); font-size: 18px; margin: 12px 0 4px; }
.setting { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
.setting:last-child { border-bottom: 0; }
.setting svg { width: 20px; height: 20px; color: var(--dim); flex: 0 0 20px; }
.setting .chev { width: 16px; height: 16px; color: var(--faint); }
.switch { position: relative; width: 50px; height: 30px; flex: 0 0 50px; border-radius: 15px; background: var(--surface3); transition: background .15s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: var(--text); transition: transform .15s; }
.switch.on { background: var(--accent); } .switch.on::after { transform: translateX(20px); background: var(--on-accent); }

/* ---------- workout ---------- */
.ex { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px 4px; margin-bottom: 12px; }
.ex.ss { border-left-width: 3px; }
.ex.linked-below { margin-bottom: 2px; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
.ex.linked-above { border-top-left-radius: 4px; border-top-right-radius: 4px; }
.ex-head { display: flex; align-items: center; gap: 8px; padding: 0 8px 4px; }
.ex-name { font-size: 18px; font-weight: 700; }
.sets { width: 100%; border-collapse: separate; border-spacing: 0 3px; table-layout: fixed; }
.sets th { font-size: 10px; letter-spacing: .06em; color: var(--faint); font-weight: 700; padding: 2px 0; }
.sets td { padding: 0 3px; text-align: center; }
.sets tr.done td { background: var(--accent-dim); }
.sets tr.done td:first-child { border-radius: 8px 0 0 8px; } .sets tr.done td:last-child { border-radius: 0 8px 8px 0; }
.c-set { width: 34px; } .c-prev { width: 76px; } .c-chk { width: 50px; }
.set-no { font-weight: 700; color: var(--dim); height: 40px; width: 100%; }
.set-no.warmup { color: var(--warm); } .set-no.drop { color: var(--cardio); } .set-no.failure { color: var(--danger); }
.prev { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { width: 100%; height: 40px; border: 0; border-radius: 8px; background: var(--surface2); text-align: center; font-weight: 600;
  font-variant-numeric: tabular-nums; outline: none; padding: 0 2px; font-size: 17px; }
.num::placeholder { color: var(--faint); font-weight: 500; }
.num:focus { box-shadow: 0 0 0 2px var(--accent); }
tr.done .num { background: transparent; }
.chk { width: 44px; height: 38px; border-radius: 8px; background: var(--surface3); color: var(--faint); display: inline-flex; align-items: center; justify-content: center; }
.chk svg { width: 20px; height: 20px; }
tr.done .chk { background: var(--accent); color: var(--on-accent); }
.pace { text-align: right; padding-right: 56px; font-size: 12px; color: var(--dim); }
.add-set svg { width: 16px; height: 16px; }
.add-set { display: flex; align-items: center; justify-content: center; gap: 4px; height: 36px; margin: 8px 8px 0; border-radius: 8px; background: var(--surface2); color: var(--dim); font-weight: 600; font-size: 14px; width: calc(100% - 16px); }
.note { width: calc(100% - 16px); margin: 0 8px 8px; min-height: 40px; padding: 8px 10px; border-radius: 8px; border: 0; background: var(--surface2); font-size: 16px; resize: none; outline: none; }
#restbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--surface2); border-top: 1px solid var(--border); padding: 12px 12px calc(12px + var(--sab)); display: none; }
#restbar.show { display: block; }
#restbar .prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }
#restbar .adj { min-width: 56px; height: 42px; border-radius: 8px; background: var(--surface3); font-weight: 700; font-size: 15px; }
#restbar .adj.skip { background: var(--accent); color: var(--on-accent); }
#restbar .time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
#restbar.flash { animation: flash .5s 3; }
@keyframes flash { 50% { background: var(--accent); color: var(--on-accent); } }
.finish-btn { background: var(--accent); color: var(--on-accent); font-weight: 700; border-radius: 8px; height: 34px; padding: 0 14px; font-size: 15px; }

/* ---------- template editor ---------- */
.stepper { display: flex; align-items: center; justify-content: space-between; height: 40px; border-radius: 8px; background: var(--surface2); }
.stepper button { width: 34px; height: 40px; font-size: 20px; font-weight: 600; }
.flabel { font-size: 10px; font-weight: 700; color: var(--dim); letter-spacing: .06em; text-align: center; margin-bottom: 3px; }

/* ---------- overlays ---------- */
#layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); pointer-events: auto; animation: fade .15s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; background: var(--surface); border-radius: 16px 16px 0 0; pointer-events: auto;
  display: flex; flex-direction: column; padding-bottom: var(--sab); animation: up .2s ease-out; max-width: 640px; margin: 0 auto; }
.sheet.full { top: calc(var(--sat) + 12px); max-height: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.sheet-head h2 { flex: 1; font-size: 17px; text-align: center; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; flex: 1; }
.sheet-foot { padding: 12px 16px; border-top: 1px solid var(--border); }
.menu { padding: 8px 12px 12px; }
.menu h3 { font-size: 13px; color: var(--dim); text-align: center; font-weight: 600; padding: 8px 0 10px; }
.menu button { display: block; width: 100%; min-height: 52px; background: var(--surface2); font-size: 17px; text-align: center; }
.menu button + button { border-top: 1px solid var(--border); }
.menu button:first-of-type { border-radius: 12px 12px 0 0; } .menu button:last-of-type { border-radius: 0 0 12px 12px; }
.menu button:only-of-type { border-radius: 12px; }
.menu button.destructive { color: var(--danger); }
.menu .cancel { margin-top: 8px; border-radius: 12px !important; font-weight: 700; border-top: 0 !important; }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(320px, calc(100vw - 48px)); background: var(--surface2);
  border-radius: 16px; pointer-events: auto; overflow: hidden; animation: pop .15s; }
.dialog .d-body { padding: 20px 18px 16px; text-align: center; }
.dialog h3 { font-size: 17px; margin-bottom: 6px; } .dialog p { color: var(--dim); font-size: 14px; white-space: pre-line; }
.dialog .d-btns { display: flex; border-top: 1px solid var(--border); }
.dialog .d-btns button { flex: 1; height: 48px; font-size: 17px; color: var(--accent); }
.dialog .d-btns button + button { border-left: 1px solid var(--border); font-weight: 700; }
.dialog .d-btns button.destructive { color: var(--danger); }
.dialog .field { margin-top: 12px; height: 44px; background: var(--surface3); }
#toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + var(--sab) + 16px); transform: translateX(-50%); z-index: 200; background: var(--surface3);
  color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4);
  opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; }
body.no-tabs #toast { bottom: calc(var(--sab) + 100px); }
.sel-bar { display: flex; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: var(--r-md); padding: 0 12px; }
.search input { flex: 1; height: 44px; border: 0; background: transparent; outline: none; }
.search svg { width: 18px; height: 18px; color: var(--faint); }
.check { width: 26px; height: 26px; border-radius: 13px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.install { border: 1px dashed var(--accent); }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(40px); opacity: .5; } } @keyframes pop { from { transform: translate(-50%, -48%) scale(.96); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<div id="restbar"></div>
<nav id="tabs"></nav>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
window.KS_SITE = true;
/* ---- 02_core.js ---- */
'use strict';
/* ==========================================================================
   02_core — namespace, ids, parsing, units, formatting. DOM-free (runs in Node
   for the test runner).
   ========================================================================== */
const ROOT = typeof window !== 'undefined' ? window : globalThis;
const APP = { name: 'Knur Simulator', short: 'Knur', version: '1.0.0', built: '2026-09-23' };
const KS = (ROOT.KS = ROOT.KNUR = ROOT.KS || { APP });
KS.APP = APP;

// ---------- ids ----------
let _idCounter = 0;
/** Short, sortable, collision-resistant text id. */
function newId() {
  _idCounter = (_idCounter + 1) % 1296;
  return (
    Date.now().toString(36) +
    _idCounter.toString(36).padStart(2, '0') +
    Math.random().toString(36).slice(2, 8).padEnd(6, '0')
  );
}

// ---------- parsing (phone keypads: Polish iPhones type a comma) ----------
/** "82,5" | "82.5" | " 100 " → number; "" / junk → null. */
function parseNumber(input) {
  if (input == null) return null;
  const s = String(input).trim().replace(/\s+/g, '').replace(',', '.');
  if (s === '') return null;
  if (!/^-?\d*\.?\d+$|^-?\d+\.$/.test(s)) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

/** Non-negative integer or null. */
function parseCount(input) {
  const n = parseNumber(input);
  if (n == null || n < 0) return null;
  return Math.round(n);
}

/** "1:30" → 90, "1:02:03" → 3723; a plain number is read in `plainUnit` ('sec' | 'min'). */
function parseDuration(input, plainUnit = 'sec') {
  if (input == null) return null;
  const s = String(input).trim().replace(',', '.');
  if (s === '') return null;
  if (s.includes(':')) {
    const parts = s.split(':');
    if (parts.length > 3 || parts.some((p) => !/^\d+$/.test(p))) return null;
    return parts.reduce((acc, p) => acc * 60 + Number(p), 0);
  }
  const n = parseNumber(s);
  if (n == null || n < 0) return null;
  return Math.round(plainUnit === 'min' ? n * 60 : n);
}

// ---------- units (always store kg / metres / seconds) ----------
const KG_PER_LB = 0.45359237;
const round = (n, d) => Math.round(n * 10 ** d) / 10 ** d;
function toDisplayWeight(kg, unit) {
  return unit === 'lb' ? round(kg / KG_PER_LB, 1) : round(kg, 2);
}
function fromDisplayWeight(value, unit) {
  return unit === 'lb' ? value * KG_PER_LB : value;
}
function fmtWeight(kg, unit) {
  return kg == null ? '' : String(toDisplayWeight(kg, unit));
}
function fmtKm(m) {
  return m == null ? '' : String(round(m / 1000, 2));
}

// ---------- formatting ----------
const pad2 = (n) => String(n).padStart(2, '0');
/** 75 → "1:15", 3723 → "1:02:03". */
function fmtClock(total) {
  const s = Math.max(0, Math.round(total));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h > 0 ? `${h}:${pad2(m)}:${pad2(sec)}` : `${m}:${pad2(sec)}`;
}
/** 3900 → "1h 5m", 600 → "10m", 45 → "45s". */
function fmtDurShort(total) {
  const s = Math.max(0, Math.round(total));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return m > 0 ? `${h}h ${m}m` : `${h}h`;
  if (m > 0) return `${m}m`;
  return `${s}s`;
}
/** 1200 s over 4000 m → "5:00 /km". */
function fmtPace(durationS, distanceM) {
  if (!durationS || !distanceM || distanceM <= 0) return null;
  return `${fmtClock(durationS / (distanceM / 1000))} /km`;
}
/** 12450 → "12 450". */
function fmtInt(n) {
  return Math.round(n)
    .toString()
    .replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
/** "Tue 23 Sep" (+ year when not the current year). */
function fmtDate(ts, now = Date.now()) {
  const d = new Date(ts);
  const base = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  return d.getFullYear() === new Date(now).getFullYear() ? base : `${base} ${d.getFullYear()}`;
}
function fmtShortDate(ts) {
  const d = new Date(ts);
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function fmtMonth(ts) {
  const d = new Date(ts);
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function defaultWorkoutName(ts) {
  const h = new Date(ts).getHours();
  if (h < 11) return 'Morning workout';
  if (h < 17) return 'Afternoon workout';
  return 'Evening workout';
}
/** Monday 00:00 of the week containing `ts`. */
function startOfWeek(ts = Date.now()) {
  const d = new Date(ts);
  const day = (d.getDay() + 6) % 7;
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - day);

/* ==========================================================================
   02d_store — persistence. IndexedDB is primary; localStorage keeps a mirror
   when it fits. On boot the newer copy (by savedAt) wins.

   NEVER RENAME: DB_NAME 'knur', LS_KEY 'knur.v1'. Changing either orphans

const DB_NAME = 'knur'; // do not rename
const LS_KEY = 'knur.v1'; // do not rename

/** The one live state object (set at boot). */

const Store = {
  _db: null,
  _timer: null,
  _pending: null,
  lastError: null,

    if (this._db) return Promise.resolve(this._db);
    if (typeof indexedDB === 'undefined') return Promise.resolve(null);
    return new Promise((resolve) => {
      let req;

        req = indexedDB.open(DB_NAME, 1);
      } catch (e) {
        resolve(null);
        return;
      }
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => {
        this._db = req.result;
        resolve(this._db);
      };
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);

      try {

        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve(true);

  async flush() {

  },

  el.className = 'sheet' + (full ? ' full' : '');
  el.innerHTML = `<div class="sheet-head"><div style="min-width:64px">${left || `<button class="link" data-a="closeLayer">Close</button>`}</div><h2>${esc(title)}</h2><div style="min-width:64px;text-align:right">${right}</div></div>
    <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}`;
  return Layer.push(el, { onClose });
}

/** Action sheet. options: [{label, fn, destructive}] */
function menu(title, options) {
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="menu">${title ? `<h3>${esc(title)}</h3>` : ''}${options
    .map((o, i) => `<button data-mi="${i}" class="${o.destructive ? 'destructive' : ''}">${esc(o.label)}</button>`)
    .join('')}<button class="cancel" data-mi="-1">Cancel</button></div>`;
  el.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-mi]');
    if (!b) return;
    ev.stopPropagation();
    const i = Number(b.dataset.mi);
    Layer.close();
    if (i >= 0) options[i].fn();
  });
  Layer.push(el);
}

function dialog({ title, msg = '', ok = 'OK', cancel = 'Cancel', destructive = false, input = null }) {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'dialog';
    el.setAttribute('role', 'dialog');
    el.innerHTML = `<div class="d-body"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}${
      input ? `<input class="field" id="dlg-in" value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}" autocomplete="off">` : ''
    }</div><div class="d-btns">${cancel ? `<button data-d="0">${esc(cancel)}</button>` : ''}<button data-d="1" class="${destructive ? 'destructive' : ''}">${esc(ok)}</button></div>`;
    let done = false;
    const finish = (v) => {
      if (done) return;
      done = true;
      Layer.close();
      resolve(v);
    };
    el.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-d]');
      if (!b) return;
      ev.stopPropagation();
      if (b.dataset.d === '1') finish(input ? $('#dlg-in', el).value : true);
      else finish(input ? null : false);
    });
    Layer.push(el, { onClose: () => { if (!done) { done = true; resolve(input ? null : false); } } });
    if (input) {
      const f = $('#dlg-in', el);
      f.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); finish(f.value); } });
      setTimeout(() => { f.focus(); f.select(); }, 50);
    }
  });
}
const confirmDlg = (title, msg, ok = 'OK', destructive = false) => dialog({ title, msg, ok, destructive });
const alertDlg = (title, msg) => dialog({ title, msg, ok: 'OK', cancel: null });
const promptDlg = (title, value = '', placeholder = '') => dialog({ title, ok: 'Save', input: { value, placeholder } });

let _toastTimer = null;
function toast(msg, ms = 2400) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------- screen wake lock (keeps the phone awake during a workout) ----------
const Wake = {
  lock: null,
  want: false,
  async update() {
    const want = !!(S && S.settings.keepAwake && ui.route && ui.route.name === 'active' && activeWorkout(S));
    this.want = want;
    if (!('wakeLock' in navigator)) return;
    try {
      if (want && !this.lock && document.visibilityState === 'visible') {
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', () => (this.lock = null));
      } else if (!want && this.lock) {
        await this.lock.release();
        this.lock = null;
      }
    } catch (e) {
      this.lock = null; // not allowed (low battery, unsupported) — harmless
    }
  },
};
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    Wake.lock = null;
    Wake.update();
    Rest.tick();
  } else {
    Store.flush();
  }
});
window.addEventListener('pagehide', () => Store.flush());

// ---------- beep (Web Audio; iOS needs a tap first to allow sound) ----------
const Beep = {
  ctx: null,
  unlock() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      g.gain.value = 0;
      o.connect(g).connect(this.ctx.destination);
      o.start();
      o.stop(this.ctx.currentTime + 0.01);
    } catch (e) {
      this.ctx = null;
    }
  },
  play() {
    if (!this.ctx) return;
    try {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      const t0 = this.ctx.currentTime;
      [0, 0.22, 0.44].forEach((d, i) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(0.0001, t0 + d);
        g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
        o.connect(g).connect(this.ctx.destination);
        o.start(t0 + d);
        o.stop(t0 + d + 0.2);
      });
    } catch (e) { /* ignore */ }
  },
};
document.addEventListener('touchstart', () => Beep.unlock(), { passive: true, once: true });

/** Start a workout, guarding against two running at once. */
function startFlow(make) {
  const active = activeWorkout(S);
  const begin = () => {
    const id = make();
    if (!id) return;
    commit({ render: false });
    go('active');
  };
  if (!active) return begin();
  menu(`“${active.name}” is still in progress`, [
    { label: 'Resume it', fn: () => go('active') },
    {
      label: 'Discard it and start new',
      destructive: true,
      fn: () => {
        deleteWorkout(S, active.id);
        Rest.stop();
        begin();
      },
    },
  ]);
}
A.startEmpty = () => startFlow(() => startWorkout(S));

/* ---- 05_workout.js ---- */
/* ==========================================================================
   05_workout — the active workout screen and the rest timer.
   Typing into a set field updates S immediately (no re-render, so the keyboard
   stays up); ticking ✓ re-renders. Everything is saved as it happens.
   ========================================================================== */
const REST_CHOICES = [30, 45, 60, 90, 120, 150, 180, 240, 300];

// ---------- rest timer (persisted in S.restTimer so it survives reloads) ----------
const Rest = {
  _iv: null,
  start(seconds, label) {
    if (!seconds || seconds <= 0) return;
    S.restTimer = { endsAt: Date.now() + seconds * 1000, total: seconds, label };
    Store.save();
    this.ensureTicking();
    this.paint();
  },
  adjust(delta) {
    const t = S.restTimer;
    if (!t) return;
    t.endsAt = Math.max(Date.now() + 1000, t.endsAt + delta * 1000);
    t.total = Math.max(1, t.total + delta);
    Store.save();
    this.paint();
  },
  stop() {
    if (!S.restTimer) return;
    S.restTimer = null;
    Store.save();
    this.paint();
  },
  ensureTicking() {
    if (this._iv) return;
    this._iv = setInterval(() => this.tick(), 250);
  },
  tick() {
    const t = S && S.restTimer;
    if (!t) {
      clearInterval(this._iv);
      this._iv = null;
      return;
    }
    if (Date.now() >= t.endsAt) {
      const lateBy = Date.now() - t.endsAt;
      S.restTimer = null;
      Store.save();
      this.paint();
      if (document.visibilityState === 'visible' && lateBy < 5000) {
        if (S.settings.restSound) Beep.play();
        const bar = $('#restbar');
        toast(`Rest over. Next: ${t.label}`, 3000);
        if (bar) { const tm = $('.time', bar); if (tm) tm.textContent = '0:00'; bar.classList.add('show', 'flash'); setTimeout(() => bar.classList.remove('show', 'flash'), 1600); }
      }
      return;
    }
    this.paint();
  },
  paint() {
    const bar = $('#restbar');
    if (!bar) return;
    const t = S && S.restTimer;
    const onWorkout = ui.route && ui.route.name === 'active';
    if (!t || !onWorkout) {
      if (!bar.classList.contains('flash')) bar.classList.remove('show');
      return;
    }
    const left = Math.max(0, Math.ceil((t.endsAt - Date.now()) / 1000));
    const pct = Math.min(100, (left / t.total) * 100);
    if (!bar.firstChild || !bar.dataset.built) {
      bar.innerHTML = `<div class="prog"></div><div class="row">
        <button class="adj" data-a="restAdj" data-d="-15">−15</button>
        <div class="grow" style="text-align:center"><div class="time"></div><div class="tiny dim ell rest-label"></div></div>
        <button class="adj" data-a="restAdj" data-d="15">+15</button>
        <button class="adj skip" data-a="restSkip">Skip</button></div>`;
      bar.dataset.built = '1';
    }
    bar.classList.add('show');
    $('.prog', bar).style.width = pct + '%';
    $('.time', bar).textContent = fmtClock(left);
    $('.rest-label', bar).textContent = `Rest · next: ${t.label}`;
  },
};
A.restAdj = (d) => Rest.adjust(Number(d.d));
A.restSkip = () => Rest.stop();

/** Name of what comes after completing a set of item `idx` (superset-aware). */
function nextUpLabel(w, idx) {
  const info = supersetInfo(w.items.map((i) => i.superset));
  const hasUndone = (i) => w.items[i] && w.items[i].sets.some((s) => !s.done);
  const name = (i) => exById(S, w.items[i].exerciseId)?.name || 'Next exercise';
  if (info[idx] && info[idx].label) {
    let first = idx, last = idx;
    while (first > 0 && !info[first].isFirst) first--;
    while (last < w.items.length - 1 && !info[last].isLast) last++;
    for (let i = first; i <= last; i++) if (hasUndone(i)) return name(i);
    for (let i = last + 1; i < w.items.length; i++) if (hasUndone(i)) return name(i);
    return null;
  }
  if (hasUndone(idx)) return name(idx);
  for (let i = idx + 1; i < w.items.length; i++) if (hasUndone(i)) return name(i);
  return null;
}

// ---------- view ----------
function setRowHtml(w, item, ex, s, n, prev) {
  const u = unit();
  const fields = fieldsFor(ex.tracking);
  const badge = s.kind === 'working' ? String(n) : { warmup: 'W', drop: 'D', failure: 'F' }[s.kind];
  const cells = fields
    .map((f) => {
      const pv = prev && prev[f.key] != null ? f.format(prev[f.key], u) : '–';
      return `<td><input class="num" inputmode="${f.mode === 'numeric' ? 'numeric' : 'decimal'}" enterkeyhint="done" autocomplete="off" aria-label="${esc(f.label(u))}"
        data-i="setField" data-b="setFieldBlur" data-s="${s.id}" data-f="${f.key}" value="${esc(f.format(s[f.key], u))}" placeholder="${esc(pv)}"></td>`;
    })
    .join('');
  const pace = ex.tracking === 'cardio' && s.done ? fmtPace(s.durationS, s.distanceM) : null;
  return `<tr class="${s.done ? 'done' : ''}" data-row="${s.id}">
      <td><button class="set-no ${s.kind}" data-a="setMenu" data-s="${s.id}" aria-label="Set options">${badge}</button></td>
      <td class="prev">${esc(summarizeSet(ex.tracking, prev, u))}</td>${cells}
      <td><button class="chk" data-a="tick" data-s="${s.id}" aria-label="Complete set" aria-pressed="${s.done}">${icon('check')}</button></td></tr>
      ${pace ? `<tr><td colspan="${fields.length + 3}" class="pace">pace ${esc(pace)}</td></tr>` : ''}`;
}

    html += `<section class="${cls}" style="${ssStyle(ss)}">
      <div class="ex-head">${ssBadge(ss)}<button class="grow" style="text-align:left" data-a="exMenu" data-it="${item.id}">
        <div class="ex-name ell ${ex.tracking === 'cardio' ? 'cardio' : ''}">${esc(ex.name)}</div><div class="small dim">${esc(sub)}</div></button>
        <button class="icon-btn" data-a="exMenu" data-it="${item.id}" aria-label="Exercise options">${icon('more')}</button></div>
      ${item.notes != null ? `<textarea class="note" rows="1" placeholder="Note (seat height, grip, how it felt…)" data-i="itemNote" data-it="${item.id}">${esc(item.notes)}</textarea>` : ''}
      <table class="sets"><colgroup><col class="c-set"><col class="c-prev">${fields.map(() => '<col>').join('')}<col class="c-chk"></colgroup>
        <thead><tr><th>SET</th><th>PREVIOUS</th>${fields.map((f) => `<th>${esc(f.label(u).toUpperCase())}</th>`).join('')}<th></th></tr></thead>

    <div class="caps mt24" style="margin-bottom:6px">Workout notes</div>
    <textarea class="field" rows="2" placeholder="How did it go? Energy, sleep, pain…" data-i="workoutNote">${esc(w.notes || '')}</textarea>
    <button class="btn ghost mt24" data-a="discardWorkout">Discard workout</button>`;

  return {
    title: w.name,
    titleHtml: `<button data-a="renameWorkout" style="max-width:100%"><div class="ell">${esc(w.name)}</div><div class="small dim tnum" style="font-weight:500" data-elapsed="${w.startedAt}">${fmtClock((Date.now() - w.startedAt) / 1000)}</div></button>`,
    left: backBtn('today'),
    right: `<button class="finish-btn" data-a="finishWorkout">Finish</button>`,
    body: html,
    noTabs: true,
    tab: 'today',
  };
};

// ---------- handlers ----------
function activeCtx(setId) {
  const w = activeWorkout(S);
  if (!w) return null;
  const f = findSet(w, setId);
  return f ? { w, ...f, ex: exById(S, f.item.exerciseId) } : null;
}
I.setField = (d, el) => {
  const c = activeCtx(d.s);
  if (!c) return;
  const field = fieldsFor(c.ex.tracking).find((f) => f.key === d.f);
  const v = field.parse(el.value, unit());
  if (v === undefined) return; // half-typed / invalid: keep the stored value
  c.set[d.f] = v;
  Store.save();
};
BL.setFieldBlur = (d, el) => {
  const c = activeCtx(d.s);
  if (!c) return;
  const field = fieldsFor(c.ex.tracking).find((f) => f.key === d.f);
  el.value = field.format(c.set[d.f], unit());
};
A.tick = async (d) => {
  const c = activeCtx(d.s);
  if (!c) return;
  if (c.set.done) {
    c.set.done = false;
    c.set.doneAt = null;
    commit();
    return;
  }
  // A field may still hold text the input handler rejected mid-typing; read it now.
  const row = document.querySelector(`[data-row="${c.set.id}"]`);
  if (row) for (const inp of $$('input[data-f]', row)) I.setField(inp.dataset, inp);
  const res = completeSet(S, c.w, c.item, c.set);
  if (!res.ok) {
    alertDlg('Nothing to log yet', res.tracking === 'cardio' ? 'Enter a duration or distance first.' : res.tracking === 'time' ? 'Enter a time in seconds first (e.g. 60).' : 'Enter reps first.');
    return;
  }
  if (navigator.vibrate) navigator.vibrate(15);
  const idx = c.w.items.indexOf(c.item);
  if (c.ex.tracking !== 'cardio') {
    const label = nextUpLabel(c.w, idx);
    if (!label) Rest.stop();
    else if (shouldRestAfter(c.w.items.map((i) => i.superset), idx)) Rest.start(c.item.restS ?? S.settings.defaultRestS, label);
    else if (S.settings.supersetRestS > 0) Rest.start(S.settings.supersetRestS, label);
    else Rest.stop();
  }
  commit();
};
A.addSet = (d) => {
  const w = activeWorkout(S);
  const item = w && w.items.find((i) => i.id === d.it);

function tField(label, inner, width) {
  return `<div style="${width ? `width:${width}px;flex:0 0 ${width}px` : 'flex:1;min-width:0'}"><div class="flabel">${esc(label)}</div>${inner}</div>`;
}
function tInput(t, item, key, value, placeholder, mode = 'decimal') {
  return `<input class="num" inputmode="${mode}" enterkeyhint="done" autocomplete="off" data-i="tField" data-b="tFieldBlur" data-t="${t.id}" data-it="${item.id}" data-k="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}">`;
}
/** Parse + format for each editable template field. */
const T_FIELDS = {
  repMin: { parse: (s) => (s.trim() ? parseCount(s) ?? undefined : null), fmt: (v) => (v == null ? '' : String(v)) },
  repMax: { parse: (s) => (s.trim() ? parseCount(s) ?? undefined : null), fmt: (v) => (v == null ? '' : String(v)) },
  weightKg: {
    parse: (s) => { if (!s.trim()) return null; const n = parseNumber(s); return n == null || n < 0 ? undefined : fromDisplayWeight(n, unit()); },
    fmt: (v) => fmtWeight(v, unit()),
  },
  durationS: { parse: (s) => (s.trim() ? parseDuration(s, 'sec') ?? undefined : null), fmt: (v) => (v == null ? '' : fmtClock(v)) },
  durationMin: { key: 'durationS', parse: (s) => (s.trim() ? parseDuration(s, 'min') ?? undefined : null), fmt: (v) => (v == null ? '' : String(Math.round(v / 60))) },
  distanceM: { parse: (s) => { if (!s.trim()) return null; const n = parseNumber(s); return n == null || n < 0 ? undefined : n * 1000; }, fmt: (v) => fmtKm(v) },

function fmtRecord(type, value, u) {
  switch (type) {
    case 'e1rm':
    case 'weight': return `${Math.round(toDisplayWeight(value, u) * 10) / 10} ${u}`;
    case 'volume': return `${fmtInt(toDisplayWeight(value, u))} ${u}`;
    case 'reps': return `${value} reps`;
    case 'distance': return `${fmtKm(value)} km`;
    case 'duration': return fmtClock(value);
    case 'pace': return `${fmtClock(value)} /km`;
  }
  return String(value);
}

   sheet, and the multi-select exercise picker used by workouts & templates.

const EX_FILTERS = ['All', 'Recent', ...MUSCLES];

function filterExercises(list, query, filter) {
  let l = list;
  if (filter === 'Recent') l = l.filter((e) => e.lastUsed).sort((a, b) => b.lastUsed - a.lastUsed);
  else if (filter && filter !== 'All') l = l.filter((e) => e.muscle === filter);
  const q = (query || '').trim().toLowerCase();
  if (q) {
    const words = q.split(/\s+/);
    l = l.filter((e) => words.every((w) => `${e.name} ${e.muscle} ${e.equipment}`.toLowerCase().includes(w)));
  }
  return l;
}
function exRowHtml(e, { selected = null, action = 'openExercise' } = {}) {
  const sel = selected ? selected.indexOf(e.id) : -1;

    ${selected ? `<div class="check ${sel >= 0 ? 'on' : ''}">${sel >= 0 ? sel + 1 : ''}</div>` : icon('chev', 'faint')}</button>`;

function exListHtml(list, query, opts) {
  const q = (query || '').trim();
  const exact = S.exercises.some((e) => !e.hidden && e.name.toLowerCase() === q.toLowerCase());
  let html = '';
  if (q.length > 1 && !exact) {

      <div class="avatar" style="color:var(--accent)">${icon('plus')}</div><div class="grow accent" style="color:var(--accent)">Create “${esc(q)}”</div></button>`;

  return html;

function exerciseSheet(id, name) {
  const existing = id ? exById(S, id) : null;
  const form = existing
    ? { name: existing.name, muscle: existing.muscle, equipment: existing.equipment, tracking: existing.tracking }
    : { ...guessExercise(name || '') };
  const body = () => `<div class="caps">Name</div>
    <input class="field mt8" id="exf-name" value="${esc(form.name)}" placeholder="e.g. Landmine Press" autocomplete="off" enterkeyhint="done">
    <div class="caps mt24">Type</div><div class="stack mt8">${TRACKING_TYPES.map(
      (t) => `<button class="card" style="width:100%;text-align:left;padding:12px;${form.tracking === t.id ? 'border-color:var(--accent)' : ''}" data-xf="tracking" data-v="${t.id}">
        <div class="bold" style="${form.tracking === t.id ? 'color:var(--accent)' : ''}">${esc(t.label)}</div><div class="small dim">${esc(t.hint)}</div></button>`,
    ).join('')}</div>
    <div class="caps mt24">Muscle group</div><div class="chips wrap mt8">${MUSCLES.map((m) => `<button class="chip ${form.muscle === m ? 'on' : ''}" data-xf="muscle" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <div class="caps mt24">Equipment</div><div class="chips wrap mt8">${EQUIPMENT.map((m) => `<button class="chip ${form.equipment === m ? 'on' : ''}" data-xf="equipment" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <button class="btn primary mt24" data-xf="save">${existing ? 'Save' : 'Create exercise'}</button>
    ${existing ? `<button class="btn danger mt12" data-xf="hide">${existing.custom ? 'Delete exercise' : 'Hide from library'}</button>` : ''}`;
  const el = openSheet({ title: existing ? 'Edit exercise' : 'New exercise', body: body(), full: true });
  const bodyEl = $('.sheet-body', el);
  bodyEl.addEventListener('input', (ev) => { if (ev.target.id === 'exf-name') form.name = ev.target.value; });
  bodyEl.addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-xf]');
    if (!b) return;
    const k = b.dataset.xf;
    if (k === 'save') {
      if (!form.name.trim()) { alertDlg('Name required', 'Give the exercise a name.'); return; }
      if (existing) {
        Object.assign(existing, { name: form.name.trim(), muscle: form.tracking === 'cardio' ? 'Cardio' : form.muscle, equipment: form.equipment, tracking: form.tracking, category: form.tracking === 'cardio' ? 'cardio' : 'strength' });
      } else {
        const newId = createExercise(S, { ...form, muscle: form.tracking === 'cardio' ? 'Cardio' : form.muscle });
        ui.lastCreatedExercise = newId;
      }
      Layer.close();
      commit();
      return;
    }
    if (k === 'hide') {
      const ok = await confirmDlg(existing.custom ? 'Delete exercise?' : 'Hide exercise?', 'It disappears from the library. Past workouts keep their history.', existing.custom ? 'Delete' : 'Hide', true);
      if (!ok) return;
      existing.hidden = true;
      Layer.close();
      commit({ render: false });
      go('exercises', { replace: true });
      return;
    }
    form[k] = b.dataset.v;
    if (k === 'tracking' && b.dataset.v === 'cardio') form.muscle = 'Cardio';
    const y = bodyEl.scrollTop;
    bodyEl.innerHTML = body();
    bodyEl.scrollTop = y;
  });
  if (!existing) setTimeout(() => $('#exf-name', el)?.focus(), 80);
}

// ---------- detail ----------
const detailMetric = {};
function metricsFor(tracking, u) {
  const w = (v) => String(Math.round(toDisplayWeight(v, u) * 10) / 10);
  switch (tracking) {
    case 'bodyweight_reps': return [{ k: 'reps', label: 'Most reps', v: (st) => st.maxReps, f: (v) => String(Math.round(v)) }];
    case 'time': return [{ k: 'hold', label: 'Longest hold', v: (st, sets) => Math.max(0, ...sets.map((s) => s.durationS || 0)) || null, f: fmtClock }];
    case 'cardio': return [
      { k: 'dist', label: 'Distance', v: (st) => st.distanceM || null, f: (v) => `${fmtKm(v)} km` },
      { k: 'time', label: 'Duration', v: (st) => st.durationS || null, f: fmtClock },
      { k: 'pace', label: 'Pace /km', invert: true, v: (st, sets) => bestPace(sets), f: fmtClock },
    ];
    default: return [
      { k: 'e1rm', label: 'Est. 1RM', v: (st) => st.bestE1rm, f: w, unit: true },
      { k: 'weight', label: 'Heaviest', v: (st) => st.maxWeight, f: w, unit: true },
      { k: 'volume', label: 'Volume', v: (st) => st.volumeKg || null, f: (v) => fmtInt(toDisplayWeight(v, u)), unit: true },
    ];
  }
}
function lineChart(points, { color = 'var(--accent)', format = String, invert = false } = {}) {
  if (points.length < 2) return `<p class="small dim" style="padding:16px 0">Log this exercise twice to see a trend.</p>`;
  const W = 340, H = 150, pl = 6, pr = 48, pt = 12, pb = 12;
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  if (minY === maxY) { minY -= 1; maxY += 1; }
  const w = W - pl - pr, h = H - pt - pb;
  const sx = (x) => pl + (maxX === minX ? w / 2 : ((x - minX) / (maxX - minX)) * w);
  const sy = (y) => { const t = (y - minY) / (maxY - minY); return pt + (invert ? t : 1 - t) * h; };
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
  const top = invert ? minY : maxY, bottom = invert ? maxY : minY;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
    <line x1="${pl}" x2="${pl + w}" y1="${pt}" y2="${pt}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <line x1="${pl}" x2="${pl + w}" y1="${pt + h}" y2="${pt + h}" stroke="var(--border)" stroke-dasharray="3 4"/>
    <text x="${W - 2}" y="${pt + 4}" fill="var(--faint)" font-size="11" text-anchor="end">${esc(format(top))}</text>
    <text x="${W - 2}" y="${pt + h + 4}" fill="var(--faint)" font-size="11" text-anchor="end">${esc(format(bottom))}</text>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${i === points.length - 1 ? 4 : 2}" fill="${color}"/>`).join('')}</svg>`;
}

VIEWS.exercise = (r) => {
  const ex = exById(S, r.id);
  if (!ex) return { redirect: 'exercises' };
  const u = unit();
  const hist = exerciseHistory(S, ex.id);
  const metrics = metricsFor(ex.tracking, u);
  const m = metrics.find((x) => x.k === detailMetric[ex.id]) || metrics[0];
  const points = hist.slice().reverse().map((h) => ({ x: h.startedAt, y: m.v(sessionStats(h.sets), h.sets) })).filter((p) => p.y != null && p.y > 0);
  const best = points.length ? (m.invert ? Math.min(...points.map((p) => p.y)) : Math.max(...points.map((p) => p.y))) : null;
  let html = `<h1 style="font-size:28px;letter-spacing:-.02em">${esc(ex.name)}</h1><div class="row mt8">${ex.muscle ? `<span class="pill">${esc(ex.muscle.toUpperCase())}</span>` : ''}${
    ex.equipment ? `<span class="pill">${esc(ex.equipment.toUpperCase())}</span>` : ''}${ex.hidden ? `<span class="pill danger">HIDDEN</span>` : ''}</div>
    <div class="card mt16"><div class="stats">${stat('sessions', String(hist.length))}${stat('best · ' + m.label, best != null ? m.f(best) : '—')}${stat('last', hist[0] ? fmtShortDate(hist[0].startedAt) : '—')}</div></div>`;
  if (metrics.length > 1) html += `<div class="chips mt12">${metrics.map((x) => `<button class="chip ${x.k === m.k ? 'on' : ''}" data-a="metric" data-ex="${ex.id}" data-k="${x.k}">${esc(x.label)}</button>`).join('')}</div>`;
  html += `<div class="card mt8"><div class="caps">${esc(m.label)}${m.unit ? ` (${u})` : ''}</div>${lineChart(points, { color: ex.tracking === 'cardio' ? 'var(--cardio)' : 'var(--accent)', format: m.f, invert: m.invert })}</div>`;
  html += `<div class="section"><span class="caps">History</span></div>`;
  if (!hist.length) html += `<p class="dim">No sessions yet.</p>`;
  html += `<div class="stack">${hist
    .map((h) => {
      const e1 = ex.tracking === 'weight_reps' ? sessionStats(h.sets).bestE1rm : null;
      return `<div class="card tap" data-a="go" data-to="workout/${h.workoutId}"><div class="row between"><span class="bold">${esc(fmtDate(h.startedAt))}</span><span class="small dim ell" style="max-width:55%">${esc(h.name)}</span></div>
        <div class="dim tnum mt4">${h.sets.map((s) => (s.kind === 'warmup' ? `(${esc(summarizeSet(ex.tracking, s, u))})` : esc(summarizeSet(ex.tracking, s, u)))).join('&nbsp;&nbsp; ')}</div>
        ${e1 ? `<div class="tiny faint mt4">e1RM ${Math.round(toDisplayWeight(e1, u) * 10) / 10} ${u}</div>` : ''}</div>`;
    })
    .join('')}</div>`;
  return {
    title: ex.name,
    titleHtml: '&nbsp;',
    left: backBtn('exercises'),
    right: `<button class="icon-btn" data-a="editExercise" data-id="${ex.id}" aria-label="Edit exercise" style="color:var(--accent)">${icon('edit')}</button>`,
    body: html,
    tab: 'today',
  };
};

const REST_DEFAULTS = [45, 60, 90, 120, 150, 180, 240];
const SUPERSET_RESTS = [0, 10, 15, 20, 30, 45, 60];
const DAY_MS = 86400000;

function settingRow(ic, label, { value = '', action = '', right = null, danger = false, data = '' } = {}) {
  const inner = `${icon(ic)}<span class="grow ${danger ? 'danger' : ''}">${esc(label)}</span>${value ? `<span class="dim">${esc(value)}</span>` : ''}${right ?? (action ? icon('chev', 'chev') : '')}`;
  return action ? `<button class="setting" data-a="${action}" ${data}>${inner}</button>` : `<div class="setting">${inner}</div>`;
}
const toggle = (on, action) => `<button class="switch ${on ? 'on' : ''}" data-a="${action}" role="switch" aria-checked="${on}"></button>`;
function agoText(ts) {
  if (!ts) return 'never';
  const days = Math.floor((Date.now() - ts) / DAY_MS);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : `${days} days ago`;
}

// ---------- backup ----------
A.exportBackup = async () => {
  const name = backupFileName();
  const json = JSON.stringify(makeBackup(S));
  const blob = new Blob([json], { type: 'application/json' });
  let shared = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      shared = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user closed the share sheet
  }
  if (!shared) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  S.settings.lastBackupAt = Date.now();
  commit();
  toast(shared ? 'Backup ready. Save it to Files or iCloud Drive.' : `Saved ${name}`);
};
A.importBackup = () => $('#import-file').click();
C.importFile = async (d, el) => {
  const file = el.files && el.files[0];
  el.value = '';
  if (!file) return;
  let next;
  try {
    next = stateFromBackup(JSON.parse(await file.text()));
  } catch (e) {
    alertDlg('Can’t restore that file', e instanceof SyntaxError ? 'The file is not valid JSON.' : e.message);
    return;
  }
  const c = stateCounts(next);
  const ok = await confirmDlg('Replace all data?', `The backup has ${plural(c.workouts, 'workout')} and ${plural(c.templates, 'template')}. Everything currently in the app is replaced. A restore point is kept so you can undo.`, 'Replace', true);
  if (!ok) return;
  await Store.snapshot('before restore');
  replaceState(next);
  toast(`Restored ${plural(c.workouts, 'workout')}`);
};
function replaceState(next) {
  next.restTimer = null;
  S = next;
  Store.flush();
  go('today', { replace: true });
}
A.useRestorePoint = async () => {
  const p = await Store.restorePoint();
  if (!p) return;
  const ok = await confirmDlg('Undo?', `Go back to your data from ${fmtDate(p.at)} ${fmtTime(p.at)} (${plural(p.counts.workouts, 'workout')}). Your current data becomes the new restore point.`, 'Undo');
  if (!ok) return;
  const old = normalizeState(JSON.parse(p.state));
  await Store.snapshot('before undo');
  replaceState(old);
  toast('Done');
};
A.eraseAll = async () => {
  const ok = await confirmDlg('Erase all data?', 'Deletes every workout, template and custom exercise on this phone. A restore point is kept so you can undo.', 'Erase', true);
  if (!ok) return;
  await Store.snapshot('before erase');
  const settings = S.settings;
  const fresh = normalizeState(null);
  fresh.settings = settings;
  replaceState(fresh);
  toast('All data erased');
};

A.installHelp = () =>
  alertDlg(
    isStandalone() ? 'Already installed' : 'Install on your iPhone',
    isStandalone()
      ? 'You are running the installed app. To update it, use “Check for an update”.'
      : '1. Open this page in Safari.\n2. Tap the Share button.\n3. Choose “Add to Home Screen”, then Add.\nIt opens full screen and works offline. Data saved in Safari and in the Home Screen app are separate, so start logging in the installed app.',

A.checkUpdate = async () => {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') {
    alertDlg('Test build', 'This copy runs from a file, so it doesn’t update itself. Install from the GitHub page to get updates.');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { toast('Not installed yet'); return; }
    await reg.update();
    if (reg.installing || reg.waiting) toast('Updating…');
    else toast(`You have the latest version (${APP.version})`);
  } catch (e) {
    toast('Couldn’t check. Are you online?');
  }
};
A.runSelfTest = () => {
  const r = KS.test({ quiet: true });
  alertDlg('Self-test', r.failed ? `${r.passed} passed, ${r.failed} failed:\n${r.failures.slice(0, 5).join('\n')}` : `All ${r.passed} checks passed.`);

/* ---- 10_tests.js ---- */
/* ==========================================================================
   10_tests — self-tests. Run KS.test() in the browser console, or
   `node source/run-tests.js` on the PC. DOM-free; uses a throwaway state.
   ========================================================================== */
KS.test = function test({ quiet = false } = {}) {
  let passed = 0;
  const failures = [];
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const ok = (name, cond) => (cond ? passed++ : failures.push(name));
  const is = (name, actual, expected) => (eq(actual, expected) ? passed++ : failures.push(`${name}: got ${JSON.stringify(actual)}, want ${JSON.stringify(expected)}`));
  const near = (name, a, b, eps = 0.01) => ok(`${name} (${a} ≈ ${b})`, a != null && Math.abs(a - b) < eps);
  const set = (weightKg, reps, extra = {}) => ({ weightKg, reps, durationS: null, distanceM: null, calories: null, ...extra });
  const DAY = 86400000;

  // --- parsing ---
  is('comma decimal', parseNumber('82,5'), 82.5);
  is('dot decimal', parseNumber('82.5'), 82.5);
  is('spaces', parseNumber(' 100 '), 100);
  is('trailing dot', parseNumber('10.'), 10);
  is('leading dot', parseNumber('.5'), 0.5);
  is('empty', parseNumber(''), null);
  is('junk', parseNumber('abc'), null);
  is('two dots', parseNumber('1.2.3'), null);
  is('count', parseCount('8'), 8);
  is('negative count', parseCount('-1'), null);
  is('mm:ss', parseDuration('1:30'), 90);
  is('h:mm:ss', parseDuration('1:02:03'), 3723);
  is('plain seconds', parseDuration('45'), 45);
  is('plain minutes', parseDuration('20', 'min'), 1200);
  is('comma minutes', parseDuration('20,5', 'min'), 1230);
  is('bad duration', parseDuration('1:x'), null);

  // --- units & formatting ---
  is('lb round trip', toDisplayWeight(fromDisplayWeight(225, 'lb'), 'lb'), 225);
  is('kg format', fmtWeight(82.5, 'kg'), '82.5');
  is('null weight', fmtWeight(null, 'kg'), '');
  is('clock', fmtClock(75), '1:15');
  is('clock hours', fmtClock(3723), '1:02:03');
  is('clock negative', fmtClock(-5), '0:00');
  is('pace', fmtPace(1200, 4000), '5:00 /km');
  is('pace no distance', fmtPace(100, 0), null);
  is('dur short', fmtDurShort(3900), '1h 5m');
  is('dur minutes', fmtDurShort(600), '10m');
  is('int', fmtInt(12450), '12 450');
  is('plural one', plural(1, 'set'), '1 set');
  is('plural many', plural(3, 'set'), '3 sets');
  is('plural y', plural(2, 'category'), '2 categories');
  is('plural vowel y', plural(2, 'day'), '2 days');
  is('esc', esc('<a href="x">'), '&lt;a href=&quot;x&quot;&gt;');
  const mon = new Date(startOfWeek(new Date(2026, 8, 23, 15).getTime()));
  is('week starts Monday', [mon.getDay(), mon.getDate(), mon.getHours()], [1, 21, 0]);
  const ids = new Set();
  for (let i = 0; i < 5000; i++) ids.add(newId());
  is('unique ids', ids.size, 5000);

  // --- stats ---
  is('e1rm single', estimate1RM(100, 1), 100);
  near('e1rm 10 reps', estimate1RM(100, 10), 133.33);
  is('e1rm capped', estimate1RM(100, 13), null);
  const st = sessionStats([set(40, 10, { kind: 'warmup' }), set(80, 8), set(80, 6)]);
  is('volume excludes warm-up', st.volumeKg, 80 * 14);
  is('sets include warm-up', st.sets, 3);
  const prevS = [[set(80, 8), set(80, 8)]];
  is('strength records', detectRecords('weight_reps', [set(82.5, 8), set(82.5, 8)], prevS).map((h) => h.type).sort(), ['e1rm', 'volume', 'weight']);
  is('no records first time', detectRecords('weight_reps', [set(80, 8)], []), []);
  is('no records when weaker', detectRecords('weight_reps', [set(70, 5)], prevS), []);
  is('pace record (lower wins)', detectRecords('cardio', [set(null, null, { durationS: 1440, distanceM: 5000 })], [[set(null, null, { durationS: 1500, distanceM: 5000 })]]).map((h) => h.type), ['pace']);
  is('reps record', detectRecords('bodyweight_reps', [set(null, 12)], [[set(null, 10)]]).map((h) => h.type), ['reps']);
  is('hold record', detectRecords('time', [set(null, null, { durationS: 75 })], [[set(null, null, { durationS: 60 })]]).map((h) => h.type), ['duration']);
  is('short pace ignored', bestPace([set(null, null, { durationS: 60, distanceM: 100 })]), null);

  // --- supersets ---
  let keys = [null, null, null, null];
  keys = toggleLinkWithNext(keys, 0);
  ok('link pair', keys[0] != null && keys[0] === keys[1] && keys[2] == null);
  keys = toggleLinkWithNext(keys, 1);
  is('triple labels', supersetInfo(keys).map((i) => i.label), ['A1', 'A2', 'A3', null]);
  keys = toggleLinkWithNext(keys, 0);
  is('unlink first', supersetInfo(keys).map((i) => i.label), [null, 'A1', 'A2', null]);
  is('two groups', supersetInfo(['x', 'x', null, 'y', 'y']).map((i) => i.label), ['A1', 'A2', null, 'B1', 'B2']);
  is('rest only after round', [0, 1, 2].map((i) => shouldRestAfter(['x', 'x', null], i)), [false, true, true]);
  is('orphans normalised', normalizeKeys(['x', null, 'y']), [null, null, null]);

  // --- prefill & targets ---
  const prev = [set(80, 8), set(80, 7)];
  is('prefill from last time', [prefillSet(0, prev, { weightKg: 60, repMin: 6 }).weightKg, prefillSet(0, prev, null).reps], [80, 8]);
  is('prefill beyond last time', prefillSet(3, prev, null).reps, 7);
  is('prefill from template', [prefillSet(0, [], { weightKg: 60, repMin: 6, repMax: 8 }).weightKg, prefillSet(0, [], { repMin: 6, repMax: 8 }).reps], [60, 6]);
  is('set count template', initialSetCount('weight_reps', { sets: 4 }, []), 4);
  is('set count history', initialSetCount('weight_reps', null, prev), 2);
  is('set count cardio', initialSetCount('cardio', null, []), 1);
  is('target range', formatTarget('weight_reps', { sets: 3, repMin: 6, repMax: 8 }), '3 × 6–8');
  is('target fixed', formatTarget('weight_reps', { sets: 4, repMin: 10, repMax: 10 }), '4 × 10');
  is('target cardio', formatTarget('cardio', { sets: 1, durationS: 1200, distanceM: 3500 }), '20 min · 3.5 km');
  is('summary weight', summarizeSet('weight_reps', set(80, 8), 'kg'), '80×8');
  is('summary added', summarizeSet('bodyweight_reps', set(10, 12), 'kg'), '+10×12');
  is('summary cardio', summarizeSet('cardio', set(null, null, { durationS: 1200, distanceM: 3200 }), 'kg'), '20:00 · 3.2 km');
  is('field parse comma kg', fieldsFor('weight_reps')[0].parse('82,5', 'kg'), 82.5);
  is('field parse bad', fieldsFor('weight_reps')[1].parse('x', 'kg'), undefined);
  is('field parse cleared', fieldsFor('weight_reps')[1].parse('', 'kg'), null);
  is('field minutes', fieldsFor('cardio')[0].parse('20', 'kg'), 1200);

  // --- model: seed ---
  const T = normalizeState(null);
  const nSeed = T.exercises.length;
  ok('seeded exercises', nSeed >= 70);
  is('seed idempotent', seedExercises(T), 0);
  is('unique seed ids', new Set(T.exercises.map((e) => e.id)).size, nSeed);
  ok('12 cardio', T.exercises.filter((e) => e.tracking === 'cardio').length === 12);
  const BENCH = slugId('Bench Press'), ROW = slugId('Barbell Row'), TREAD = slugId('Treadmill'), PLANK = slugId('Plank');
  const custom = createExercise(T, guessExercise('Landmine Press'));
  is('no duplicate custom', createExercise(T, guessExercise('landmine press')), custom);
  is('guess cardio', guessExercise('Morning run').tracking, 'cardio');

  // --- model: a full workout ---
  const logAll = (w, values) => {
    for (const it of w.items) for (const s of it.sets) Object.assign(s, values[it.exerciseId] || {}, { done: true, doneAt: Date.now() });
  };
  const w1id = startWorkout(T);
  const w1 = workoutById(T, w1id);
  w1.startedAt -= 3 * DAY;
  addExercisesToWorkout(T, w1id, [BENCH, TREAD], false);
  is('default set counts', w1.items.map((i) => i.sets.length), [3, 1]);
  is('one active workout', activeWorkout(T).id, w1id);
  logAll(w1, { [BENCH]: { weightKg: 80, reps: 8 }, [TREAD]: { durationS: 1200, distanceM: 3000 } });
  addSet(w1.items[0]);
  is('stats before finish', [workoutStats(T, w1).sets, workoutStats(T, w1).undone], [4, 1]);
  finishWorkout(T, w1id);
  ok('finished', !!w1.finishedAt && !activeWorkout(T));
  is('undone sets dropped', w1.items[0].sets.length, 3);
  is('first session no records', workoutRecords(T, w1id), []);

  const w2id = startWorkout(T);
  const w2 = workoutById(T, w2id);
  addExercisesToWorkout(T, w2id, [BENCH, TREAD], false);
  is('prefilled from last session', w2.items[0].sets.map((s) => [s.weightKg, s.reps]), [[80, 8], [80, 8], [80, 8]]);
  is('cardio prefilled', w2.items[1].sets[0].durationS, 1200);
  // Tick with carry-forward: clear later sets, change set 1, tick it.
  w2.items[0].sets.forEach((s) => { s.weightKg = null; s.reps = null; });
  Object.assign(w2.items[0].sets[0], { weightKg: 82.5, reps: 8 });
  ok('complete set', completeSet(T, w2, w2.items[0], w2.items[0].sets[0]).ok);
  is('carried forward', w2.items[0].sets.map((s) => [s.weightKg, s.reps, s.done]), [[82.5, 8, true], [82.5, 8, false], [82.5, 8, false]]);
  // Empty set with no history can't be ticked.
  const w2b = { ...w2, items: [] };
  ok('empty set refused', !completeSet(T, w2b, { exerciseId: custom, sets: [makeSet({})] }, makeSet({})).ok);
  w2.items[0].sets.forEach((s) => completeSet(T, w2, w2.items[0], s));
  Object.assign(w2.items[1].sets[0], { durationS: 1150, distanceM: 3000 });
  completeSet(T, w2, w2.items[1], w2.items[1].sets[0]);
  finishWorkout(T, w2id);
  is('records', workoutRecords(T, w2id).map((r) => `${r.exerciseName}:${r.type}`).sort(), ['Bench Press:e1rm', 'Bench Press:volume', 'Bench Press:weight', 'Treadmill:pace']);
  near('volume', workoutStats(T, w2).volumeKg, 82.5 * 8 * 3);
  is('cardio time', workoutStats(T, w2).cardioS, 1150);
  is('history newest first', exerciseHistory(T, BENCH).map((h) => h.workoutId), [w2id, w1id]);
  is('previous excludes itself', previousSets(T, BENCH, w2id, w2.startedAt)[0].weightKg, 80);
  is('usage counted', listExercises(T).find((e) => e.id === BENCH).timesUsed, 2);

  // --- model: supersets in a workout ---
  const w3id = startWorkout(T);
  const w3 = workoutById(T, w3id);
  addExercisesToWorkout(T, w3id, [BENCH, ROW], true);
  addExercisesToWorkout(T, w3id, [PLANK], false);
  is('superset added', supersetInfo(w3.items.map((i) => i.superset)).map((i) => i.label), ['A1', 'A2', null]);
  toggleSupersetItem(w3.items, w3.items[1].id);
  is('link third', supersetInfo(w3.items.map((i) => i.superset)).map((i) => i.label), ['A1', 'A2', 'A3']);
  removeItem(w3.items, w3.items[1].id);
  is('remove keeps pair', supersetInfo(w3.items.map((i) => i.superset)).map((i) => i.label), ['A1', 'A2']);
  moveItem(w3.items, w3.items[1].id, -1);
  is('move breaks pair', [w3.items.map((i) => i.exerciseId), w3.items.map((i) => i.superset)], [[PLANK, BENCH], [null, null]]);
  deleteWorkout(T, w3id);
  ok('deleted', !workoutById(T, w3id));

  // --- model: templates ---
  const tid = createTemplate(T, 'Push A');
  addExercisesToTemplate(T, tid, [BENCH, ROW], false);
  addExercisesToTemplate(T, tid, [TREAD], false);
  const t = templateById(T, tid);
  Object.assign(t.items[0], { sets: 4, repMin: 6, repMax: 8, weightKg: 60 });
  toggleSupersetItem(t.items, t.items[0].id);
  ok('template superset', t.items[0].superset && t.items[0].superset === t.items[1].superset);
  is('cardio template default', t.items[2].durationS, 1200);
  const w4id = startWorkout(T, { templateId: tid });
  const w4 = workoutById(T, w4id);
  is('from template name', w4.name, 'Push A');
  is('from template sets', w4.items[0].sets.length, 4);
  is('history beats template weight', w4.items[0].sets[0].weightKg, 82.5);
  is('template weight used without history', w4.items[1].sets[0].weightKg, null);
  is('row reps from template', w4.items[1].sets[0].reps, 8);
  ok('superset copied', w4.items[0].superset && w4.items[0].superset === w4.items[1].superset);
  logAll(w4, { [BENCH]: { weightKg: 85, reps: 6 }, [ROW]: { weightKg: 50, reps: 10 }, [TREAD]: { durationS: 900 } });
  finishWorkout(T, w4id);
  is('last done tracked', listTemplates(T)[0].id, tid);
  const saved = templateById(T, saveWorkoutAsTemplate(T, w4id));
  is('saved template', [saved.items[0].sets, saved.items[0].repMin, saved.items[0].weightKg], [4, 6, 85]);
  const again = workoutById(T, repeatWorkout(T, w4id));
  is('repeat structure', again.items.map((i) => i.sets.length), [4, 3, 1]);
  ok('repeat not done', again.items.every((i) => i.sets.every((s) => !s.done)));
  deleteWorkout(T, again.id);
  const dup = templateById(T, duplicateTemplate(T, tid));
  ok('duplicate', dup.name === 'Push A (copy)' && dup.items.length === 3 && dup.items[0].id !== t.items[0].id);
  deleteTemplate(T, dup.id);
  ok('template deleted', !templateById(T, dup.id));

  // --- backup ---
  T.settings.unit = 'lb';
  const b = JSON.parse(JSON.stringify(makeBackup(T)));
  const R = stateFromBackup(b);
  is('backup workouts', R.workouts.length, T.workouts.length);
  is('backup settings', R.settings.unit, 'lb');
  ok('backup custom exercise', R.exercises.some((e) => e.name === 'Landmine Press'));
  let threw = '';
  try { stateFromBackup({ hello: 1 }); } catch (e) { threw = e.message; }
  ok('reject foreign file', threw.includes('not a Knur Simulator backup'));
  try { stateFromBackup({ format: 'knur-simulator-backup', schema: 99, data: {} }); } catch (e) { threw = e.message; }
  ok('reject newer schema', threw.includes('newer version'));
  is('restored state reseeds', R.exercises.filter((e) => !e.custom).length, nSeed);

  const result = { passed, failed: failures.length, failures };
  if (!quiet && typeof console !== 'undefined') {
    console.log(`Knur Simulator self-test: ${passed} passed, ${failures.length} failed`);
    failures.forEach((f) => console.warn('FAIL ' + f));
  }
  return result;
};

/* ==========================================================================
   11_init — demo data, service worker, boot.
   ========================================================================== */

/** Eight weeks of sample training (3×/week, Push/Pull/Legs + cardio). KS.demo() or ?demo=1 */
KS.demo = function demo() {
  const E = (n) => slugId(n);
  const mk = (name, items) => {
    const id = createTemplate(S, name);
    const t = templateById(S, id);
    for (const [ex, sets, repMin, repMax, ss] of items) {
      const e = exById(S, E(ex));
      const it = { ...makeTemplateItem(e, ss || null), sets, repMin, repMax };
      if (e.tracking === 'cardio') Object.assign(it, { sets: 1, repMin: null, repMax: null, durationS: repMin * 60 });
      t.items.push(it);
    }
    normalizeItems(t.items);
    return t;
  };
  const push = mk('Push A', [['Bench Press', 4, 6, 8], ['Overhead Press', 3, 8, 10], ['Incline Dumbbell Press', 3, 8, 12], ['Lateral Raise', 3, 12, 15, 'a'], ['Triceps Pushdown', 3, 10, 12, 'a'], ['Treadmill', 1, 15]]);
  const pull = mk('Pull A', [['Pull-up', 4, 6, 10], ['Barbell Row', 4, 6, 8], ['Lat Pulldown', 3, 10, 12, 'b'], ['Face Pull', 3, 12, 15, 'b'], ['Dumbbell Curl', 3, 10, 12]]);
  const legs = mk('Legs', [['Squat', 4, 5, 8], ['Romanian Deadlift', 3, 8, 10], ['Leg Press', 3, 10, 12], ['Standing Calf Raise', 4, 12, 15], ['Stationary Bike', 1, 20]]);
  const base = { 'Bench Press': 70, 'Overhead Press': 40, 'Incline Dumbbell Press': 24, 'Lateral Raise': 8, 'Triceps Pushdown': 25, 'Barbell Row': 60, 'Lat Pulldown': 55, 'Face Pull': 20, 'Dumbbell Curl': 12, Squat: 90, 'Romanian Deadlift': 80, 'Leg Press': 160, 'Standing Calf Raise': 60 };
  const plan = [push, pull, legs];
  const day = 86400000;
  const start = new Date();
  start.setHours(18, 0, 0, 0);
  let n = 0;
  for (let week = 8; week >= 1; week--) {
    for (const [k, off] of [[0, 0], [1, 2], [2, 4]]) {
      const t = plan[k];
      const ts = start.getTime() - week * 7 * day + off * day;
      const w = { id: newId(), templateId: t.id, name: t.name, startedAt: ts, finishedAt: ts + (55 + (n % 4) * 5) * 60000, notes: null, items: [] };
      const prog = 8 - week;
      for (const ti of t.items) {
        const ex = exById(S, ti.exerciseId);
        const it = { id: newId(), exerciseId: ex.id, superset: ti.superset, restS: null, notes: null, sets: [] };
        if (ex.tracking === 'cardio') {
          const dur = (ti.durationS || 900) + prog * 30;
          it.sets.push({ ...makeSet({ durationS: dur, distanceM: Math.round((dur / 60) * (ex.name === 'Treadmill' ? 160 : 420) * (1 + prog * 0.01)), calories: Math.round(dur / 6) }), done: true, doneAt: ts });
        } else if (ex.tracking === 'bodyweight_reps') {
          for (let s = 0; s < ti.sets; s++) it.sets.push({ ...makeSet({ reps: Math.max(4, 7 + Math.floor(prog / 2) - s) }), done: true, doneAt: ts });
        } else {
          const b = base[ex.name] || 20;
          const inc = b >= 50 ? 2.5 : 1;
          const wt = b + Math.floor(prog / 2) * inc;
          for (let s = 0; s < ti.sets; s++) it.sets.push({ ...makeSet({ weightKg: wt, reps: Math.max(ti.repMin, ti.repMax - s - (prog % 2)) }), done: true, doneAt: ts });
        }
        w.items.push(it);
      }
      S.workouts.push(w);
      n++;
    }
  }
  Store.flush();
  if (typeof render === 'function') render();
  return n;
};

function registerServiceWorker() {
  if (!ROOT.KS_SITE || !('serviceWorker' in navigator) || !/^https?:/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    Store.flush().then(() => {
      toast('Updated to the latest version');
      setTimeout(() => location.reload(), 700);
    });
  });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function boot() {
  const { state, fresh } = await Store.load();
  S = state;
  if (fresh) await Store.flush();
  Store.persist();
  if (/[?&]demo=1\b/.test(location.search) && !S.workouts.length) KS.demo();
  if (S.restTimer) Rest.ensureTicking();
  render();
  registerServiceWorker();
}
boot();
